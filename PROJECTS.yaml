---
name: project_registry
description: Registry of project contexts available through this context-engineering repository
version: 1.0
metadata:
  type: registry
  critical: true
  owns: project identity and project-context roots only

projects:
  avanza:
    display_name: "Avanza Team 1"
    status: active
    context_root: "projects/avanza"
    current_legacy_context:
      project_guides: "_ai_guides/project"
      memory: "_memory"
      data: "data"
      decisions: "docs/decisions"
    repository_match:
      github_repository: "chas-challenge-2026/avanza-team1"
    migration_state: "registered_before_preservation_first_move"

resolution:
  rule: >
    Select a project only when the user names it, the active repository/workspace
    matches a separate active project repository/workspace exactly. The context
    repository itself never selects a project. If no project is identified by
    those signals, ask the user which project applies, even when only one project
    is currently registered. Never use historical frequency as a default.

---
status: ACTIVE
