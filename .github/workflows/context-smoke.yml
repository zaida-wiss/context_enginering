name: Context smoke test

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - "CONTEXT_REGISTRY.yaml"
      - "PROJECTS.yaml"
      - "projects/**"
      - "_ai_guides/**"
      - "_audit/**"
      - "data/**"
      - ".github/workflows/context-smoke.yml"
  pull_request:
    paths:
      - "CONTEXT_REGISTRY.yaml"
      - "PROJECTS.yaml"
      - "projects/**"
      - "_ai_guides/**"
      - "_audit/**"
      - "data/**"
      - ".github/workflows/context-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependencies
        run: python -m pip install PyYAML

      - name: Run presentation authority audit
        run: python _audit/validate_presentation_authorities.py

      - name: Run presentation routing audit
        run: python _audit/presentation_routing_audit.py

      - name: Self-test rendered presentation validator
        run: python _audit/rendered_presentation_audit.py --self-test

      - name: Run context smoke test
        run: python _audit/context_smoke_test.py
