---
name: context_registry
description: Central path and task registry for the context repository
version: 2.0
metadata:
  type: registry
  critical: true
  owns: logical paths and task bundles only
---

# This registry maps stable logical IDs to repository paths.
# Rule semantics stay in the owning authority files.

domains:
  instructions:
    path: "_ai_guides"
    purpose: "how tasks are performed"
  memory:
    path: "_memory"
    purpose: "long-lived project knowledge"
  data:
    path: "data"
    purpose: "live-source registry, manual source material, snapshots and derived data"
  decisions:
    path: "docs"
    purpose: "confirmed project decisions and supporting documentation"
  validation:
    path: "_audit"
    purpose: "repository integrity and authority validation"

registries:
  project_guides:
    path: "_ai_guides/project/README.md"
  presentation_authorities:
    path: "_ai_guides/presentations/AUTHORITY_REGISTRY.yaml"
  external_sources:
    path: "data/SOURCES.yaml"
  external_sources_guide:
    path: "data/SOURCES.md"
  context_ingestion:
    path: "_ai_guides/context/CONTEXT_ROUTING.yaml"

logical_destinations:
  project:
    context_router:
      path: "_ai_guides/project/PROJECT_CONTEXT_ROUTER.md"
    team_standards:
      path: "_ai_guides/project/TEAM_STANDARDS.md"
    definition_of_done:
      path: "_ai_guides/project/DEFINITION_OF_DONE.md"
    issue_body_template:
      path: "_ai_guides/project/templates/ISSUE_BODY.md"
    risk_register_template:
      path: "_ai_guides/project/templates/RISK_REGISTER.md"
    hr_and_team_support:
      path: "_ai_guides/project/HR_AND_TEAM_SUPPORT.yaml"
    team_tone_and_collaboration:
      path: "_ai_guides/project/TEAM_TONE_AND_COLLABORATION.yaml"
    testing:
      path: "_ai_guides/project/TESTING.md"
    goals_and_sprint_planning:
      path: "_ai_guides/project/GOALS_AND_SPRINT_PLANNING.md"
    risk_management:
      path: "_ai_guides/project/RISK_MANAGEMENT.md"
    dependencies_and_capacity:
      path: "_ai_guides/project/DEPENDENCIES_AND_CAPACITY.md"

  memory:
    team_roster:
      path: "_memory/TEAM_ROSTER.md"

  presentation_schemas:
    current_sprint:
      path: "_ai_guides/presentations/data/CURRENT_SPRINT_SCHEMA.yaml"

  data:
    course_schedule:
      path: "data/manual/course/TEAM_SCHEDULE.yaml"
    course_schedule_guide:
      path: "data/manual/course/SCHEDULE.md"
    course_milestones:
      path: "data/manual/course/MILESTONES.yaml"
    course_roadmap:
      path: "data/manual/course/TEAM_ROADMAP.yaml"
    course_deadlines:
      path: "data/manual/course/COURSE_DEADLINES.md"
    cto_feed_forward:
      path: "data/manual/course/CTO_FEED_FORWARD.md"
    cto_feed_forward_instructions:
      path: "data/manual/course/CTO_FEED_FORWARD_INSTRUCTIONS.md"
    ui_design_reference:
      path: "data/manual/design/UI_DESIGN_REFERENCE.md"

  decisions:
    confirmed:
      path: "docs/decisions/"

  storage:
    manual:
      path: "data/manual/"
    snapshots:
      path: "data/snapshots/"
    derived:
      path: "data/derived/"
    sprint_focus_timeline:
      path: "data/derived/SPRINT_FOCUS_TIMELINE.md"
      canonical: false

presentation_bootstrap:
  router:
    path: "_ai_guides/presentations/MANDATORY_READING_ORDER.md"
  authority_map:
    path: "_ai_guides/presentations/AUTHORITY_REGISTRY.yaml"
  integrity:
    path: "_ai_guides/presentations/INTEGRITY_CONSTRAINT.md"
  execution:
    path: "_ai_guides/presentations/SYSTEM_CONTRACT.yaml"

tasks:
  issue_creation:
    purpose: "Create or improve a GitHub issue using the project's canonical workflow."
    load:
      - "logical_destinations.project.team_standards"
      - "logical_destinations.project.testing"
      - "logical_destinations.project.definition_of_done"
      - "logical_destinations.project.issue_body_template"
      - "logical_destinations.project.team_tone_and_collaboration"
      - "logical_destinations.project.goals_and_sprint_planning"
      - "logical_destinations.project.risk_management"
      - "logical_destinations.project.dependencies_and_capacity"
    supporting_context:
      - "logical_destinations.project.risk_register_template"
      - "logical_destinations.decisions.confirmed"
    output_expectations:
      - "issue-specific Acceptance Criteria"
      - "issue-specific Testing section selected by risk"
      - "decision record reminder"
      - "risk-analysis reminder"
      - "develop-sync reminder before PR"
      - "review, merge and Done reminder"

  project_default_behavior:
    load:
      - "logical_destinations.project.team_tone_and_collaboration"

  sprint_planning:
    purpose: "Resolve decided goals from verified sources and propose future goals, milestones and issues transparently."
    load:
      - "logical_destinations.project.goals_and_sprint_planning"
      - "logical_destinations.project.risk_management"
      - "logical_destinations.project.dependencies_and_capacity"
      - "logical_destinations.project.team_standards"
      - "logical_destinations.project.testing"
      - "logical_destinations.project.team_tone_and_collaboration"
    source_refs:
      - "registries.external_sources"
    output_expectations:
      - "verified current goal/plan when available"
      - "explicit source provenance"
      - "AI proposals separated from decided state"
      - "proposal states what changes, from/to, why, expected effect and tradeoff"
      - "candidate milestones/issues linked to goal outcomes"

  team_support:
    behavior_standard:
      ref: "logical_destinations.project.hr_and_team_support"
    use_for:
      - "team conflict"
      - "negative talk about a colleague"
      - "feedback and difficult conversations"
      - "needs and expectation clashes"
      - "role/group/project fit"
      - "team wellbeing"
      - "people-support or HR-style guidance"

  monday_meeting_presentation:
    bootstrap: "presentation_bootstrap"
    content_authority:
      path: "_ai_guides/presentations/monday_meeting/design/SLIDE_DETAIL_SPEC.md"
    data_acquisition:
      path: "_ai_guides/presentations/data/DATA_ACQUISITION_CONTRACT.yaml"
    source_registry:
      ref: "registries.external_sources"
    planning_authority:
      ref: "logical_destinations.project.goals_and_sprint_planning"
    risk_authority:
      ref: "logical_destinations.project.risk_management"
    dependency_capacity_authority:
      ref: "logical_destinations.project.dependencies_and_capacity"
    design_authorities:
      - "_ai_guides/presentations/design/ACCESSIBILITY_NEURODIVERSITY.md"
      - "_ai_guides/presentations/design/VISUAL_DESIGN_MANDATORY.md"
      - "_ai_guides/presentations/design/READABILITY_HARD_RULES.md"
      - "_ai_guides/presentations/design/CARD_COMPONENT_STANDARD.md"
      - "_ai_guides/presentations/design/PROVENANCE_AND_AI_LABELING.md"
      - "_ai_guides/presentations/monday_meeting/design/LAYOUT_OVERFLOW_GUARD.md"
    verification:
      - "_ai_guides/presentations/verification/RENDER_GATE_CHECKLIST.md"
    default_delivery:
      format: "PDF"
      authority: "_ai_guides/presentations/SYSTEM_CONTRACT.yaml"

path_change_process:
  rule: >
    A moved canonical file is updated in this registry first. Dependent references
    are then updated and validated before the migration step is considered complete.
  validation:
    - "search repository for the previous canonical path"
    - "verify every registered target exists on the active ref"
    - "run applicable repository validators"

---

status: ACTIVE
last_updated: 2026-09-18
