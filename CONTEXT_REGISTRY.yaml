---
name: context_registry
description: Central path and task registry for the context repository
version: 3.7
metadata:
  type: registry
  critical: true
  owns: logical paths and task bundles only
---

# This registry maps stable logical IDs to repository paths.
# Rule semantics stay in the owning authority files.

domains:
  instructions:
    path: "_ai_guides"
    purpose: "how tasks are performed"
  memory:
    path: "_memory"
    purpose: "legacy-compatible generic memory/index domain; project-owned long-lived context resolves through the selected project manifest"
  data:
    path: "data"
    purpose: "generic repository-held manual material, snapshots and derived data; project-owned source registries resolve through the selected project manifest"
  decisions:
    path: "docs"
    purpose: "generic decision/documentation domain; project-owned facts remain under the selected project root unless explicitly registered otherwise"
  validation:
    path: "_audit"
    purpose: "repository integrity and authority validation"

registries:
  ai_framework:
    path: "_ai_guides/AI_FRAMEWORK.yaml"
  project_guides:
    path: "_ai_guides/project/README.md"
  presentation_authorities:
    path: "_ai_guides/presentations/AUTHORITY_REGISTRY.yaml"
  projects:
    path: "PROJECTS.yaml"
  context_ingestion:
    path: "_ai_guides/context/CONTEXT_ROUTING.yaml"
  context_placement:
    path: "_ai_guides/context/CONTEXT_PLACEMENT_CONTRACT.yaml"
  path_migration:
    path: "_ai_guides/context/PATH_MIGRATION_PLAN.yaml"
  project_template:
    path: "projects/_template/PROJECT.yaml"
  project_onboarding:
    path: "projects/_template/README.md"

logical_destinations:
  global:
    context_placement_contract:
      path: "_ai_guides/context/CONTEXT_PLACEMENT_CONTRACT.yaml"
    path_migration_plan:
      path: "_ai_guides/context/PATH_MIGRATION_PLAN.yaml"
    framework_decisions:
      path: "docs/decisions/"
    ai_framework:
      path: "_ai_guides/AI_FRAMEWORK.yaml"
    cognitive_accessibility_neuroinclusive_design:
      path: "_ai_guides/COGNITIVE_ACCESSIBILITY_NEUROINCLUSIVE_DESIGN.md"
    ai_best_practice_evidence_policy:
      path: "_ai_guides/AI_BEST_PRACTICE_EVIDENCE_POLICY.yaml"

  project:
    context_router:
      path: "_ai_guides/project/PROJECT_CONTEXT_ROUTER.md"
    team_standards:
      path: "_ai_guides/project/TEAM_STANDARDS.md"
    definition_of_done:
      path: "_ai_guides/project/DEFINITION_OF_DONE.md"
    issue_body_template:
      path: "_ai_guides/project/templates/ISSUE_BODY.md"
    risk_register_template:
      path: "_ai_guides/project/templates/RISK_REGISTER.md"
    hr_and_team_support:
      path: "_ai_guides/project/HR_AND_TEAM_SUPPORT.yaml"
    team_tone_and_collaboration:
      path: "_ai_guides/project/TEAM_TONE_AND_COLLABORATION.yaml"
    testing:
      path: "_ai_guides/project/TESTING.md"
    goals_and_sprint_planning:
      path: "_ai_guides/project/GOALS_AND_SPRINT_PLANNING.md"
    risk_management:
      path: "_ai_guides/project/RISK_MANAGEMENT.md"
    dependencies_and_capacity:
      path: "_ai_guides/project/DEPENDENCIES_AND_CAPACITY.md"
    cross_layer_awareness:
      path: "_ai_guides/project/CROSS_LAYER_AWARENESS.yaml"
    technical_debt:
      path: "_ai_guides/project/TECHNICAL_DEBT.md"

  project_template:
    manifest:
      path: "projects/_template/PROJECT.yaml"
    onboarding:
      path: "projects/_template/README.md"

  selected_project:
    manifest:
      resolve_via: "PROJECTS.yaml -> selected project -> manifest"
    isolation_markers:
      resolve_via: "selected project manifest -> context.isolation_markers.path"
    decision_index:
      resolve_via: "selected project manifest -> context.decisions.index.path"
    decision_records:
      resolve_via: "selected project manifest -> context.decisions.records.path"
    team_roster:
      resolve_via: "selected project manifest -> context.team_roster.path"
    source_registry:
      resolve_via: "selected project manifest -> context.sources.path"
    presentation_authority:
      resolve_via: "selected project manifest -> context.presentation.authority.path"
    team_visual_identity:
      resolve_via: "selected project manifest -> context.design.team_visual_identity.path"
    sprint_cadence:
      resolve_via: "selected project manifest -> context.sprint_cadence.path"
    repository_flow:
      resolve_via: "selected project manifest -> context.repository_flow.path"

  presentation_schemas:
    current_sprint:
      path: "_ai_guides/presentations/data/CURRENT_SPRINT_SCHEMA.yaml"

  presentation_processes:
    data_collection:
      path: "_ai_guides/presentations/data/DATA_COLLECTION_MANDATORY.md"
    active_work_detection:
      path: "_ai_guides/presentations/data/ACTIVE_WORK_DETECTION_MODEL.md"
    composition:
      path: "_ai_guides/presentations/monday_meeting/structure/COMPOSITION_ARCHITECTURE.md"

  data:
    selected_project_course:
      resolve_via: "selected project manifest -> context.course"
    selected_project_design:
      resolve_via: "selected project manifest -> context.design"


  storage:
    manual:
      path: "data/manual/"
    snapshots:
      path: "data/snapshots/"
    derived:
      path: "data/derived/"

presentation_bootstrap:
  router:
    path: "_ai_guides/presentations/MANDATORY_READING_ORDER.md"
  authority_map:
    path: "_ai_guides/presentations/AUTHORITY_REGISTRY.yaml"
  integrity:
    path: "_ai_guides/presentations/INTEGRITY_CONSTRAINT.md"
  execution:
    path: "_ai_guides/presentations/SYSTEM_CONTRACT.yaml"

tasks:
  context_ingestion:
    purpose: "Classify newly supplied information, resolve its exact canonical owner and target, and write only after placement is explicit."
    load:
      - "registries.context_ingestion"
      - "registries.context_placement"
      - "logical_destinations.global.ai_framework"
      - "registries.projects"
    behavior:
      - "split mixed input into atomic information units"
      - "resolve global/project/task-only scope"
      - "resolve exact semantic owner and exact repository path"
      - "emit a user-visible placement receipt before canonical mutation"
      - "ask one focused control question only when destination/project/authority is genuinely ambiguous or architectural"
      - "propagate registry/manifest/validator updates only when ownership or capability changes"
    validation:
      - "canonical file exists or new capability is explicitly approved and registered"
      - "project-specific information remains under the selected project root"
      - "new canonical files are registered before considered active"

  issue_creation:
    purpose: "Create or improve a GitHub issue using the project's canonical workflow."
    context_loading:
      strategy: progressive_minimum_sufficient
      required_core:
        - "logical_destinations.global.ai_framework"
        - "logical_destinations.project.team_standards"
        - "logical_destinations.project.testing"
        - "logical_destinations.project.definition_of_done"
        - "logical_destinations.project.issue_body_template"
      conditional:
        collaboration_or_people_context_material:
          - "logical_destinations.project.team_tone_and_collaboration"
        goal_or_sprint_alignment_material:
          - "logical_destinations.project.goals_and_sprint_planning"
        risk_material:
          - "logical_destinations.project.risk_management"
          - "logical_destinations.project.risk_register_template"
        dependency_capacity_or_sequencing_material:
          - "logical_destinations.project.dependencies_and_capacity"
        cross_layer_or_integration_material:
          - "logical_destinations.project.cross_layer_awareness"
        confirmed_decision_context_material:
          - "logical_destinations.selected_project.decision_records"
      rule: "Load conditional authorities only when they can materially change issue scope, order, acceptance criteria, risk, ownership or readiness."
    supporting_context:
      - "logical_destinations.project.risk_register_template"
      - "logical_destinations.selected_project.decision_records"
    output_expectations:
      - "issue-specific Acceptance Criteria"
      - "issue-specific Testing section selected by risk"
      - "decision record reminder"
      - "risk-analysis reminder"
      - "develop-sync reminder before PR"
      - "issue-specific Applicable Definition of Done selected from canonical DoD"
      - "README/documentation criterion only when scope affects it"
      - "review, merge and Done reminder"

  project_default_behavior:
    load:
      - "logical_destinations.global.ai_framework"
      - "logical_destinations.project.team_tone_and_collaboration"

  coding_assistance:
    purpose: "Help with code while checking the relevant surrounding project system."
    context_loading:
      strategy: progressive_minimum_sufficient
      required_core:
        - "logical_destinations.global.ai_framework"
        - "logical_destinations.project.team_standards"
        - "logical_destinations.project.testing"
      conditional:
        accessibility_or_cognitive_design_relevant:
          - "logical_destinations.global.cognitive_accessibility_neuroinclusive_design"
        material_best_practice_or_architecture_recommendation:
          - "logical_destinations.global.ai_best_practice_evidence_policy"
        goal_or_delivery_context_material:
          - "logical_destinations.project.goals_and_sprint_planning"
        risk_material:
          - "logical_destinations.project.risk_management"
        dependency_capacity_or_sequencing_material:
          - "logical_destinations.project.dependencies_and_capacity"
        cross_layer_or_integration_material:
          - "logical_destinations.project.cross_layer_awareness"
        technical_debt_material:
          - "logical_destinations.project.technical_debt"
        team_interaction_or_collaboration_material:
          - "logical_destinations.project.team_tone_and_collaboration"
      rule: "Load conditional authorities only when their domain can materially change the answer or action."
    behavior:
      - "solve the user's immediate coding problem"
      - "inspect relevant contract/integration context when the change crosses a boundary"
      - "inspect relevant active branches when tools/access permit"
      - "signal missing or diverging contracts early"
      - "signal dependency, estimation or capacity gaps when they affect the task"
      - "identify candidate risk or technical debt with explicit provenance"
      - "explain why the wider signal matters"
      - "keep unrelated system analysis out of the way"
    provenance:
      verified_fact: "source-backed"
      analysis: "🔎 AI-analys"
      proposal: "⭐ AI-förslag"

  sprint_planning:
    purpose: "Resolve decided goals from verified sources and propose future goals, milestones and issues transparently."
    context_loading:
      strategy: progressive_minimum_sufficient
      required_core:
        - "logical_destinations.global.ai_framework"
        - "logical_destinations.project.goals_and_sprint_planning"
        - "logical_destinations.project.dependencies_and_capacity"
        - "logical_destinations.project.team_standards"
      conditional:
        risk_material:
          - "logical_destinations.project.risk_management"
        issue_testing_or_readiness_material:
          - "logical_destinations.project.testing"
        team_interaction_or_collaboration_material:
          - "logical_destinations.project.team_tone_and_collaboration"
      rule: "Load conditional authorities only when their domain can materially change sprint goals, sequencing, readiness or team coordination."
    source_refs:
      - "logical_destinations.selected_project.source_registry"
    output_expectations:
      - "verified current goal/plan when available"
      - "explicit source provenance"
      - "AI proposals separated from decided state"
      - "proposal states what changes, from/to, why, expected effect and tradeoff"
      - "candidate milestones/issues linked to goal outcomes"

  team_support:
    behavior_standard:
      ref: "logical_destinations.project.hr_and_team_support"
    use_for:
      - "team conflict"
      - "negative talk about a colleague"
      - "feedback and difficult conversations"
      - "needs and expectation clashes"
      - "role/group/project fit"
      - "team wellbeing"
      - "people-support or HR-style guidance"

  monday_meeting_presentation:
    global_framework:
      ref: "logical_destinations.global.ai_framework"
    bootstrap: "presentation_bootstrap"
    content_authority:
      path: "_ai_guides/presentations/monday_meeting/design/SLIDE_DETAIL_SPEC.md"
    composition_authority:
      ref: "logical_destinations.presentation_processes.composition"
    current_sprint_schema:
      ref: "logical_destinations.presentation_schemas.current_sprint"
    data_acquisition:
      path: "_ai_guides/presentations/data/DATA_ACQUISITION_CONTRACT.yaml"
    data_collection_process:
      ref: "logical_destinations.presentation_processes.data_collection"
    active_work_detection:
      ref: "logical_destinations.presentation_processes.active_work_detection"
    source_registry:
      ref: "logical_destinations.selected_project.source_registry"
    project_presentation_authority:
      ref: "logical_destinations.selected_project.presentation_authority"
      required_when_declared: true
    project_team_visual_identity:
      ref: "logical_destinations.selected_project.team_visual_identity"
      required_when_declared: true
    planning_authority:
      ref: "logical_destinations.project.goals_and_sprint_planning"
    risk_authority:
      ref: "logical_destinations.project.risk_management"
    dependency_capacity_authority:
      ref: "logical_destinations.project.dependencies_and_capacity"
    cross_layer_authority:
      ref: "logical_destinations.project.cross_layer_awareness"
    technical_debt_authority:
      ref: "logical_destinations.project.technical_debt"
    design_authorities:
      - "_ai_guides/COGNITIVE_ACCESSIBILITY_NEUROINCLUSIVE_DESIGN.md"
      - "_ai_guides/presentations/design/ACCESSIBILITY_NEURODIVERSITY.md"
      - "_ai_guides/presentations/design/VISUAL_DESIGN_MANDATORY.md"
      - "_ai_guides/presentations/design/READABILITY_HARD_RULES.md"
      - "_ai_guides/presentations/design/CARD_COMPONENT_STANDARD.md"
      - "_ai_guides/presentations/design/PROVENANCE_AND_AI_LABELING.md"
      - "_ai_guides/presentations/monday_meeting/design/LAYOUT_OVERFLOW_GUARD.md"
    verification:
      - "_ai_guides/presentations/verification/RENDER_GATE_CHECKLIST.md"
    default_delivery:
      format: "PDF"
      authority: "_ai_guides/presentations/SYSTEM_CONTRACT.yaml"

path_change_process:
  authority: "_ai_guides/context/PATH_MIGRATION_PLAN.yaml"
  rule: >
    A move/rename is complete only when the source path was verified, the destination
    was resolved through its semantic owner, the new target exists, all registered
    consumers point to the new target, and the old path is no longer an active reference.
  validation:
    - "verify exact source path exists before mutation"
    - "verify destination belongs to the owning manifest/registry capability"
    - "search repository for consumers of the previous path before mutation"
    - "verify destination exists after copy/move"
    - "verify every registered target exists on the active ref"
    - "search repository again for stale previous-path references"
    - "delete old path only after destination and consumers are verified"
    - "run applicable repository validators"

---

status: ACTIVE
last_updated: 2026-09-21
