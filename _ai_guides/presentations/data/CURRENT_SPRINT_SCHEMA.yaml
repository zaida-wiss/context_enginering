---
name: current_sprint_schema
description: Schema for dynamically resolved current-sprint presentation context
metadata:
  type: schema
  status: active
  schema_version: 1.1
  note: "This file contains STRUCTURE ONLY. All values are fetched dynamically from registered sources."
---

# STRUCTURE: Current Sprint Metadata
#
# All data below MUST be fetched dynamically from registered sources.
# Do NOT hardcode examples or manual values.
# See data/SOURCES.yaml for source definitions.

current_sprint:
  # FETCH: Sprint identifier/label when available
  # SOURCE: Registered project sprint data
  sprint_id: null

  # FETCH: Sprint start date/time (ISO 8601)
  # SOURCE: Registered project sprint cadence / explicit sprint plan
  start_date: null

  # FETCH: Sprint end date/time (ISO 8601)
  # SOURCE: Next registered sprint boundary or explicit sprint plan
  end_date: null

  # FETCH: Sprint duration in days
  # SOURCE: Selected project's registered sprint cadence
  duration_days: null

  # FETCH: Exact sprint boundary rule/timezone from selected project
  # SOURCE: Selected project's registered sprint cadence
  boundary:
    start: null
    end: null
    timezone: null

  completed_this_sprint:
    # DERIVE: verified completed work within [active sprint start, verified data cutoff]
    items: []
    reset_at_sprint_boundary: true
    carry_previous_sprint_items: false
    # At the exact boundary, this list starts empty and may contain only
    # completion events timestamped at or after the new sprint start.
    boundary_state: empty_until_new_sprint_completion_is_verified

  continuing_current_state:
    # DERIVE: still-current open work/risk/dependency/blocker state
    # This is not cleared merely because a sprint boundary is crossed.
    open_work: []
    blockers: []
    risks: []
    dependencies: []

  # FETCH: Current project phase name
  # SOURCE: Google Docs meeting protocol OR GitHub project board
  phase: null

  # FETCH: Sprint focus areas (list of strings)
  # SOURCE: Google Docs meeting protocol
  sprint_focus: []

  # FETCH: Weekly goals for all teams
  # SOURCE: Google Docs meeting protocol
  weekly_goals: []

  # FETCH: What PL meeting should focus on
  # SOURCE: Google Docs meeting protocol
  pl_meeting_focus: null

  # FETCH: Current blockers list
  # SOURCE: GitHub (issues tagged "blocker") OR Google Docs meeting protocol
  blockers: []

  team_capacity:
    # FETCH: Frontend available hours this week
    # SOURCE: Google Docs meeting protocol (mötesprotokollet)
    # FORMAT: number >= 0
    frontend:
      available_hours: null
      allocated_hours: null

    # FETCH: Backend available hours this week
    # SOURCE: Google Docs meeting protocol (mötesprotokollet)
    # FORMAT: number >= 0
    backend:
      available_hours: null
      allocated_hours: null

    # FETCH: Native available hours this week
    # SOURCE: Google Docs meeting protocol (mötesprotokollet)
    # FORMAT: number >= 0
    native:
      available_hours: null
      allocated_hours: null

    # RECORD: Source system identifier
    # FORMAT: string (e.g., "meeting_protocol_gdoc")
    source: null

    # FETCH: ISO 8601 timestamp when capacity was last updated
    # SOURCE: Google Docs document metadata (last modified time)
    updated_at: null

    # FETCH: Registered sprint/period this capacity data is valid for
    # SOURCE: Presentation pipeline — must match the active project sprint
    valid_for_sprint: null

  # FETCH: Next critical deadline
  # SOURCE: Google Docs meeting protocol OR GitHub Milestones
  next_deadline:
    type: null
    date: null
    description: null

  # FETCH: Operational notes, constraints
  # SOURCE: Google Docs meeting protocol
  notes: []
