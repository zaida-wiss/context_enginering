---
name: data_acquisition_contract
description: Canonical acquisition method for required datasets — deterministic, no interpretation
metadata:
  type: process
  critical: true
  version: 1.0
---

# DATA ACQUISITION CONTRACT
#
# This file defines THE EXACT METHOD for acquiring each required dataset.
# NOT A FALLBACK LIST. A CANONICAL ALGORITHM.
# Different AI models following this contract get identical data.

test_mode_activation:
  rule: >
    TEST_MODE can ONLY be activated by explicit user request with keywords:
    "test", "fixture", "mock-data", "TEST_MODE", or "use test data"

    If user does NOT explicitly request test mode, use PRODUCTION mode.
    PRODUCTION mode requires live GitHub/Sheets sources (will STOP if unavailable).

  test_mode_behavior: >
    When explicitly activated:
    - Read merged_prs from fixtures/merged_prs_sample.json
    - Read active_issues from fixtures/active_issues_sample.json
    - Record in DATA_ACQUISITION_RECEIPT: source = "FIXTURE (test mode)"
    - Proceed through gates, modular composition, render, delivery
    - Add footer to presentation: "⚠️ TEST MODE — fixture data"

  production_mode_behavior: >
    When NOT in test mode (default):
    - Use live GitHub API, GitHub web, Google Sheets per fallback_order
    - STOP if any required source fails (do not substitute fixtures)
    - Report DATA_ACQUISITION_RECEIPT with real source diagnostics

required_datasets:
  team_roster:
    canonical_method: "Read TEAM_ROSTER.md file locally"
    requirement: 7 members
    fields:
      - name
      - github_username
      - team_designation
    stop_condition: "any member missing or unverifiable"
    fallback: "None — local file is authoritative"

  relevant_issues_activity:
    source_id: "GITHUB_RELEVANT_ISSUES"
    classification: "REQUIRED (foundation for all activity reporting)"
    purpose: "Gather all relevant issues during reporting period (not PR-centric, issue-centric)"

    CRITICAL_METHODOLOGY: >
      This is the PRIMARY data collection method. Find all RELEVANT ISSUES during REPORTING_PERIOD,
      then attribute work to assignees/participants. This ensures no work is missed.

      OLD METHOD (WRONG): "Get all merged PRs, then find who authored them"
      NEW METHOD (CORRECT): "Get ALL relevant issues (closed + open), find who worked on each, link PRs"

    execution_sequence:
      1_find_closed_issues: "GitHub API: GET /repos/.../issues?state=closed&since=[START]&until=[END]&per_page=100"
      2_find_open_issues: "GitHub API: GET /repos/.../issues?state=open&since=[START_ACTIVITY]&per_page=100"
      3_link_prs_to_issues: "For each issue, find linked PRs via issue body or GitHub API"
      4_attribute_to_persons: "For each issue, list all assignees + author + significant commenters"
      5_categorize_by_status: "✅ AVKLARAT (closed), 🟠 PÅGÅR (open + recent activity), 🔴 BLOCKERAT"

    inclusion_criteria: >
      CLOSED ISSUES: any closed during REPORTING_PERIOD
      OPEN ISSUES: must have activity (assignee, comment, commit reference) during REPORTING_PERIOD
      EXCLUDE: test-only issues, duplicates, issues closed before REPORTING_PERIOD_START

    fields_required:
      - issue.number
      - issue.title
      - issue.state (open | closed)
      - issue.assignees[] (all assignees with display_name + login)
      - issue.created_at
      - issue.updated_at
      - issue.closed_at (if closed during period)
      - issue.user.login (author)
      - linked_pull_requests[] (if any)
      - pr.merged_at (if linked PR is merged during period)
      - issue.labels (for team categorization)

    output_structure: >
      Grouped by person (from assignees + author across ALL issues):
        [Person Name] (@github_login):
          ✅ AVKLARAT:
            - #ISSUE_NUMBER Title · closed [DATE] · [PR #XXX merged]
          🟠 PÅGÅR:
            - #ISSUE_NUMBER Title · last_update [DATE]
          🔴 BLOCKERAT:
            - #ISSUE_NUMBER Title · [blocking reason if any]

    requirement: "ALL 7 team members from TEAM_ROSTER MUST appear (even with zero activity). Missing persons = DATA_AUDIT FAIL"
    stop_condition: "If any required issue data missing or TEAM_ROSTER incomplete, STOP with DATA_AUDIT ERROR"

  merged_prs:
    source_id: "GITHUB_MERGED_PRS"
    classification: "SECONDARY (supporting data, linked from per_person_activity)"
    reference: "EXTERNAL_SOURCES.yaml: GITHUB_MERGED_PRS (canonical source of truth for URL, access methods, fallback chain)"

    access_methods_authority: "EXTERNAL_SOURCES.yaml — GITHUB_MERGED_PRS (all allowed/forbidden methods defined there)"

    note: "This data feeds per_person_activity categorization. Primary collection method is per-person, not per-PR."

    execution_sequence:
      1_primary: "GitHub REST API via any allowed implementation (github_connector, http_fetch, curl, etc)"
        url: "https://api.github.com/repos/chas-challenge-2026/avanza-team1/pulls?state=closed&base=develop&per_page=100"
      2_fallback_1: "GitHub web UI (merged PRs filter)"
        url: "https://github.com/chas-challenge-2026/avanza-team1/pulls?q=is:pr+is:merged"
      3_fallback_2: "Google Sheets (ONLY if freshness_requirement verified: last_synced_at >= REPORTING_PERIOD_END)"
        url: "EXTERNAL_SOURCES.yaml: GOOGLE_PROJECT_DATA_SHEET"
      4_fallback_3: "Individual PR pages (verification only, not for completeness discovery)"
        url: "https://github.com/chas-challenge-2026/avanza-team1/pull/[NUMBER]"

    enforcement:
      rule: >
        1. Try GitHub REST API with any available implementation
        2. If API fails: try GitHub web UI
        3. If web UI fails: try Google Sheets ONLY if freshness can be verified
        4. If Sheets unavailable or stale: use individual PR pages for verification
        5. If all fail: mark DATA_ACQUISITION_RECEIPT as INCOMPLETE
        Do not attempt web_search, general_web_access, raw_github, or csv_export.
      on_violation: "STOP. Report: forbidden access method attempted for merged_prs"

    freshness_gate_for_sheets: >
      If Google Sheets fallback is needed, verify last_synced_at timestamp exists and is >= REPORTING_PERIOD_END.
      If timestamp missing or stale: do NOT use sheet for completeness source. Try GitHub web instead.

    pagination:
      required: true
      stop_when: "response contains < per_page results"
      collect_all: true

    local_filter:
      - "merged_at != null (CRITICAL: exclude unmerged PRs)"
      - "merged_at >= REPORTING_PERIOD_START"
      - "merged_at < REPORTING_PERIOD_END"
      - "base.ref == 'develop' (only develop branch)"
      - "use assignees[] for attribution (person who worked on code, not merger)"

    verification_only:
      - "Individual PR pages (verification only, not for completeness discovery)"

    requirement: "ALL merged PRs in reporting period"
    fields:
      - id (PR number)
      - title
      - assignees[] (CRITICAL: who worked on this PR, not who merged it)
      - merged_at (timestamp)
      - base.ref
      - linked_issues (if available)

    CRITICAL_RULE: >
      Show PR by ASSIGNEE (person who worked on the code), NOT by merger.
      If PR has multiple assignees: list all.
      If no assignee: show "??" + suggest owner based on:
        1. Previous commits on similar code areas
        2. Team accountability patterns (long continuous chains vs load distribution)
        3. Who has capacity (avoid overload)
      This prompts meeting decision: "Vem tar ansvar för denna?"

    stop_condition: "source fails AND all fallbacks fail (use DATA_AUDIT to confirm)"

  open_pull_requests:
    source_id: "GITHUB_OPEN_PRS"
    classification: "CRITICAL (strong signal of active work; required for ①B slides)"
    purpose: >
      Collect all open PRs linked to active issues. These PRs indicate work that is
      completed at code-level but waiting for review/merge. Essential for showing
      'Väntar i PR' status (blocker: waiting for review, not stuck).

    execution_sequence:
      1_primary: "GitHub REST API: GET /repos/chas-challenge-2026/avanza-team1/pulls?state=open&per_page=100"
      2_fallback_1: "GitHub web UI: https://github.com/chas-challenge-2026/avanza-team1/pulls"
      3_fallback_2: "Google Sheets (if freshness verified)"

    required_fields:
      - number (PR ID)
      - title
      - author.login (GitHub username)
      - assignees[] (who worked on code)
      - requested_reviewers[] (CRITICAL: who needs to review)
      - body (may contain issue reference)
      - head.ref (branch name)
      - created_at
      - updated_at
      - linked_issue (if PR closes/fixes issue)

    correlation:
      link_pr_to_issue: >
        For each open PR, attempt to find linked issue via:
        1. GitHub API: PR.linked_issues
        2. PR body text: regex for '#ISSUE_NUMBER'
        3. Branch name: regex for 'issue-NUM' or '#NUM'
        4. Commit messages in PR: grep for '#NUM'

    output_structure: >
      Per PR (for ①B slide):
        #PR_NUMBER · #ISSUE_NUMBER Title
        Assignee: [person who worked]
        Reviewers: [list of requested_reviewers, or "ej tilldelad"]
        Branch: [head.ref]
        Status: Väntar på review

    requirement: "ALL open PRs linked to active issues during REPORTING_PERIOD"
    stop_condition: "source fails AND all fallbacks fail (mark DATA_ACQUISITION_RECEIPT as INCOMPLETE)"

  repository_branches_and_commits:
    source_id: "GITHUB_BRANCHES_COMMITS"
    classification: "CRITICAL (activity evidence; required for active work detection)"
    purpose: >
      Collect branches and recent commits to detect active work on issues
      that may not yet have open PRs. Critical for slide ①C (Pågår utan PR).

      Project Board may be outdated or inaccessible; commit history is authoritative.

    execution_sequence:
      1_collect_all_branches: "GitHub API: GET /repos/chas-challenge-2026/avanza-team1/branches"

      2_CRITICAL_identify_team_collection_branches: >
        Teams often use dedicated branches as collection points BEFORE merging to develop.
        These MUST be scanned for complete risk/blocker/capacity analysis.

        KNOWN COLLECTION BRANCHES (MANDATORY to scan):
          - develop (default target)
          - Java-Development-Environment (Backend collection point)
          - [Other team-specific branches if they exist]

        DISCOVERY (if unknown branches exist):
          - List all branches with recent commits (last 14 days)
          - Filter for non-feature branches (typically *-Development-Environment or team/*-main)
          - Ask team if uncertain which are collection branches

      3_collect_recent_commits_per_branch: >
        For EACH branch (especially collection branches):
          GET /repos/chas-challenge-2026/avanza-team1/commits?sha=[branch]&since=[START]&until=[END]&per_page=100

      4_filter_relevant_branches: >
        Branches matching patterns:
          - Collection branches (develop, Java-Development-Environment, etc) — ALWAYS
          - feature/* — if recent commits
          - bugfix/* — if recent commits
          - {team}/* (frontend/, backend/, native/) — if recent commits
          - Any branch with commits in REPORTING_PERIOD

      5_exclude_stale_branches: >
        Skip branches with NO commits in REPORTING_PERIOD
        (stale branches don't affect current risk/capacity analysis)

    required_fields_per_branch:
      - name
      - last_commit_sha
      - last_commit_date (CRITICAL — shown on slide ①B/①C)
      - commit_author.login
      - commit_author.name (display name for slide)
      - commit_message (for linking to issue)

    branch_to_issue_correlation:
      infer_from: >
        1. Branch name regex: '(issue|fix|feature)-(\d+)' or '#(\d+)'
        2. Commit message regex: '#(\d+)' or 'fixes #(\d+)'
        3. Match against known issue numbers from GITHUB_OPEN_ISSUES + GITHUB_MERGED_PRS

    output_structure: >
      Per branch with recent commits:
        branch: docs/#67-update-readme
        linked_issue: #67 (inferred from branch name)
        last_commit: 2026-09-16 14:23 · Zaida Wiss
        status: Pågår (aktiv branch, commits denna vecka)

    active_work_detection_logic:
      Strongest_signals:
        - Open PR + linked issue + assignee = DEFINITE active work
        - Open issue + matching branch + recent commits = VERY LIKELY active work
        - Open issue + matching branch (no recent commits) = MAYBE active work
        - Open assigned issue alone = POSSIBLY active work

      Weakest_signals:
        - Recent commits without issue link = UNCONFIRMED (orphaned work)
        - Project Board status alone = UNRELIABLE (often outdated)

    requirement: "ALL branches with activity in REPORTING_PERIOD"
    stop_condition: "source fails AND all fallbacks fail (mark as INCOMPLETE)"

  issue_dependencies_and_blockers:
    source_id: "GITHUB_ISSUE_RELATIONSHIPS"
    classification: "CRITICAL (required for priority recommendation and analysis)"
    purpose: >
      Detect which issues block other issues. Essential for:
      - Recommending priority order
      - Identifying critical path
      - Suggesting team split/parallelization
      - Estimating realistic completion time

    execution_sequence:
      1_collect_linked_issues: "GitHub API: GET /repos/.../issues/[ID]/related (if available)"
      2_parse_issue_body: "Search issue body for '#[number]' references (blockers/dependencies)"
      3_check_pr_links: "Get PRs linked to each issue via pr.linked_issues"
      4_infer_from_branch_name: "Branch pattern might indicate dependency (e.g., 'after-#67')"
      5_explicit_labels: "Check for 'blocks-', 'depends-on-', 'after-' labels if team uses them"

    required_fields:
      - issue.number
      - issue.title
      - linked_issues[] (if issue blocks or depends on others)
      - related_pull_requests[] (if PRs depend on this issue)
      - labels (for explicit dependency markers)

    output_structure: >
      Per issue, determine:
        - What issues does THIS issue block? (#X blocks #Y, #Z)
        - What issues block THIS issue? (#A must finish first)
        - Critical path: #X → #Y → #Z (N days total)

    requirement: "ALL dependencies between open/merged issues in reporting period"
    stop_condition: "source fails AND all fallbacks fail (mark as INCOMPLETE, but continue with available data)"

  team_member_capacity_and_absence:
    source_id: "GITHUB_TEAM_ROSTER_EXTENDED"
    classification: "CRITICAL (required for workload balancing recommendation)"
    purpose: >
      For each team member, determine:
      - Current workload (how many open issues assigned)
      - Estimated time on current work (days)
      - Planned absence (vacation, sick leave, training)
      - Available capacity this week

    execution_sequence:
      1_get_team_roster: "TEAM_ROSTER.md — all 7 members"
      2_per_person_open_issues: "GitHub API: issues assigned to [person]?state=open"
      3_estimate_per_issue: "Multiply: issue complexity × average team velocity"
      4_get_absence_calendar: >
        Check: Google Calendar, team wiki, or explicit note in repo
        Format: "Zaida: absent 20-24 sep (vacation)", "Erik: Mon-Tue (doctor appt)"
      5_calculate_capacity: >
        base = 5 working days
        available = base - (absence days) - (current work days)

    required_fields:
      - person.name
      - person.github_login
      - open_issues_assigned (issue numbers + estimated effort)
      - planned_absence (dates + reason if possible)
      - current_workload_days (estimated, per issue)

    output_structure: >
      Per team member:
        Zaida:
          current_open_issues: [#72, #78] (estimated: 1.5 days)
          planned_absence: none
          capacity_available: 3.5 days

        Erik:
          current_open_issues: [#67] (estimated: 2 days)
          planned_absence: "Mon 20-21 sep (conference)"
          capacity_available: 2.5 days

    requirement: "Capacity estimate for all 7 team members"
    stop_condition: "If absence calendar unavailable: assume all available (no days subtracted)"

  active_issues:
    source_id: "GITHUB_OPEN_ISSUES"
    reference: "EXTERNAL_SOURCES.yaml: GITHUB_OPEN_ISSUES (canonical source of truth for URL, access methods, fallback chain)"

    access_methods_authority: "EXTERNAL_SOURCES.yaml — GITHUB_OPEN_ISSUES (all allowed/forbidden methods defined there)"

    execution_sequence:
      1_primary: "GitHub REST API via any allowed implementation (github_connector, http_fetch, curl, etc)"
        url: "https://api.github.com/repos/chas-challenge-2026/avanza-team1/issues?state=open&per_page=100"
      2_fallback_1: "GitHub web UI (open issues filter)"
        url: "https://github.com/chas-challenge-2026/avanza-team1/issues?q=is:open"
      3_fallback_2: "Google Sheets (ONLY if freshness_requirement verified: last_synced_at >= REPORTING_PERIOD_END)"
        url: "EXTERNAL_SOURCES.yaml: GOOGLE_PROJECT_DATA_SHEET"
      4_fallback_3: "Project Board (reconstruct from column view)"
        url: "https://github.com/orgs/chas-challenge-2026/projects/31"

    enforcement:
      rule: >
        1. Try GitHub REST API with any available implementation
        2. If API fails: try GitHub web UI
        3. If web UI fails: try Google Sheets ONLY if freshness can be verified
        4. If Sheets unavailable or stale: reconstruct from Project Board
        5. If all fail: mark DATA_ACQUISITION_RECEIPT as INCOMPLETE
        Do not attempt web_search, general_web_access, raw_github, or csv_export.
      on_violation: "STOP. Report: forbidden access method attempted for active_issues"

    freshness_gate_for_sheets: >
      If Google Sheets fallback is needed, verify last_synced_at timestamp exists and is >= REPORTING_PERIOD_END.
      If timestamp missing or stale: do NOT use sheet for completeness source. Try GitHub web instead.

    pagination:
      required: true
      stop_when: "response contains < per_page results"
      collect_all: true

    local_filter:
      - "exclude if key 'pull_request' exists (API includes pull requests; filter them out)"
      - "assignees.length > 0 (only issues with assigned owner)"
      - "updated_at >= REPORTING_PERIOD_START"
      - "updated_at < REPORTING_PERIOD_END"

    requirement: "ALL open issues with activity in reporting period, assigned to someone"
    fields:
      - id (issue number)
      - title
      - assignees[] (array of assignee objects)
      - updated_at (timestamp)
      - labels[] (for team classification)

    stop_condition: "source fails AND all fallbacks fail (use DATA_AUDIT to confirm)"

reporting_period:
  definition: "7 calendar days (one full week)"
  timezone: "Europe/Stockholm"
  format: "meeting_date - 7 days at 00:00 (inclusive) through meeting_date at 00:00 (exclusive)"

  AUTHORITATIVE_DEFINITION: |
    REPORTING_PERIOD_START = meeting_date at 00:00 minus 7 calendar days (inclusive)
    REPORTING_PERIOD_END = meeting_date at 00:00 (exclusive)
    Example: Meeting on Monday 2026-09-22
      START: 2026-09-15 00:00 Europe/Stockholm (Monday one week prior)
      END: 2026-09-22 00:00 Europe/Stockholm (meeting date at midnight)
      Coverage: All work completed between these timestamps

  compare_fields:
    merged_pr: "merged_at"
    open_issue: "updated_at"

endpoint_failure_vs_data_completeness:
  principle: >
    ENDPOINT_FAILURE is not DATA_FAILURE.

    If GitHub API fails, try GitHub web.
    If GitHub web fails, try fallback sources.
    If all sources fail, DATA_AUDIT marks dataset as INCOMPLETE.

    STOP RENDERING only if:
      team_roster.complete == false
      OR merged_prs.complete == false
      OR active_issues.complete == false

    Otherwise: render with available data, mark sources in footer.

validation_rules:
  merged_prs_minimum: "At least 1, or mark week as 'no merged work'"
  active_issues_minimum: "At least 1, or mark week as 'no open work'"
  team_roster: "Exactly 7, or STOP"

  rule: "Zero activity in a category is valid. Missing data sources are not."

  relevant_commits:
    source_id: "GITHUB_COMMITS"
    classification: "OPTIONAL (required only if presentation includes commit-level work)"
    purpose: "Commits not linked to issues or PRs (refactoring, docs, chores)"

    canonical_method:
      endpoint: "/repos/chas-challenge-2026/avanza-team1/commits"
      http_method: "GET"
      params:
        since: "REPORTING_PERIOD_START"
        until: "REPORTING_PERIOD_END"
        per_page: 100

    required_fields:
      - sha (commit hash)
      - message (commit message)
      - author.name (display name — e.g. "Zaida Wiss")
      - author.login (GitHub username — e.g. "zaida-wiss")
      - author.date (timestamp)
      - html_url (link to commit on github.com)

    presentation_format: "💾 SHA…message · Author (display_name @github_login)"
    note: "Author field MUST include both display_name AND github_login for full activity tracking"

    local_filter:
      - "exclude commits linked to merged PRs (already shown in merged_prs section)"
      - "exclude commits linked to issues (already shown in active_issues or merged_prs sections)"
      - "include only commits with activity in REPORTING_PERIOD"

    requirement: "If relevant_commits exist, ALL must be shown (not paginated)"
    fields_for_deduplication:
      - sha (unique commit identifier)

    stop_condition: "source fails AND all fallbacks fail — omit commit section if unavailable (OPTIONAL dataset)"

###############################################################################
# DATA_ACQUISITION_RECEIPT — Machine-Readable Diagnostic Logging
###############################################################################
data_acquisition_receipt:
  purpose: >
    Log exact status per source for each required dataset.
    Enable diagnosis of why DATA_AUDIT passed or failed.
    Must record source URL, status, failure_reason, and payload_summary.

  required_structure:
    execution_id: "Links to EXECUTION_RECEIPT_MACHINE.execution_id"
    attempted_at: "ISO 8601 timestamp when acquisition began"
    reporting_period: "REPORTING_PERIOD_START ... REPORTING_PERIOD_END"

  per_dataset_log:
    dataset_name: "team_roster | merged_prs | active_issues"
    canonical_source: "Primary source (e.g., 'GitHub API /repos/.../pulls')"

    sources_tested_array:
      - source_url: "Full URL attempted (including query params)"
        http_method: "GET | POST | etc"
        status: "SUCCESS | HTTP_ERROR | AUTH_ERROR | TIMEOUT | EMPTY_RESPONSE | PARSE_ERROR | TOOL_UNAVAILABLE"
        http_code: "200 | 403 | 404 | 401 | 500 | null (if tool unavailable)"
        failure_reason: "Human-readable description if status != SUCCESS"
        payload_summary: "Number of items returned, or 'empty', or parse error details"
        tried_at: "ISO 8601 timestamp"
        fallback_reason: "If trying next source: why previous failed (e.g., 'API rate limit exceeded')"

    selected_source: "Which source was finally used"
    final_status: "SUCCESS | INCOMPLETE"
    final_payload_count: "Number of items acquired"

    rule: >
      If final_status == INCOMPLETE: must list all attempted sources with their statuses.
      If final_status == SUCCESS: must document selected_source and payload_count.
      Never omit failure_reason — it is how future runs know what to fix.

  example_log:
    dataset: "merged_prs"
    source_id: "GITHUB_MERGED_PRS (see EXTERNAL_SOURCES.yaml for actual URL)"
    sources_tested:
      - source: "GITHUB_MERGED_PRS.primary (github_connector)"
        status: "HTTP_ERROR"
        http_code: 403
        failure_reason: "API rate limit exceeded (X-RateLimit-Remaining: 0)"
        tried_at: "2026-09-15T10:30:45Z"

      - source: "GITHUB_MERGED_PRS.fallbacks[0] (github_web, see EXTERNAL_SOURCES.yaml)"
        status: "EMPTY_RESPONSE"
        failure_reason: "Web page loaded but no PR data extracted (selector mismatch or page layout changed)"
        tried_at: "2026-09-15T10:31:12Z"
        fallback_reason: "GitHub API rate-limited, trying web fallback"

      - source: "GITHUB_MERGED_PRS.fallbacks[1] (google_drive_connector on GOOGLE_PROJECT_DATA_SHEET, see EXTERNAL_SOURCES.yaml)"
        status: "AUTH_ERROR"
        http_code: 403
        failure_reason: "Permission denied on Google Sheets (Sheet not shared with connector, or token expired)"
        tried_at: "2026-09-15T10:31:45Z"
        fallback_reason: "GitHub web fallback failed, trying Sheets"

    final_status: "INCOMPLETE"
    selected_source: "none (all failed)"

    diagnostic: >
      All three sources failed. API: rate-limited. Web: selector mismatch (possible GitHub UI change).
      Sheets: permission denied. Suggest: check API key renewal, verify web scraping selectors,
      verify Sheets sharing permissions and connector authentication.

  gate_rule: >
    If ANY required_dataset has final_status == INCOMPLETE:
      → DATA_AUDIT marks that dataset as INCOMPLETE
      → Presentation generation STOPS (per SYSTEM_CONTRACT.yaml)
      → MUST report to user the COMPLETE sources_tested_array (all attempts), not just last failure
      → Format:
         [dataset] acquisition INCOMPLETE. Sources tried:
         1. [source_url]: [status] [http_code] — [failure_reason]
         2. [source_url]: [status] [http_code] — [failure_reason]
         3. [source_url]: [status] [http_code] — [failure_reason]

         This enables diagnosis: rate limiting (429), auth (401/403), DNS errors, timeouts, etc.

    Else:
      → DATA_AUDIT proceeds
      → DATA_AUDIT checksums verify completeness
      → build_gate may proceed

  terminal_vs_data_problems: >
    ENDPOINT_FAILURE (DNS, TERM variable, path issues, network timeout) ≠ DATA_FAILURE.

    If a terminal/shell problem occurs (TERM not set, environment variable missing),
    and registered fallbacks remain untried, continue to next fallback source.

    Do NOT classify shell/terminal errors as "data unavailable".
    Continue through all registered fallbacks per DATA_ACQUISITION_CONTRACT.yaml.

    Only after ALL registered fallbacks fail with actual data-fetch attempts does
    final_status = INCOMPLETE become valid.
