---
name: data_acquisition_contract
description: Canonical acquisition method for required datasets — deterministic, no interpretation
metadata:
  type: process
  critical: true
  version: 1.0
---

# DATA ACQUISITION CONTRACT
#
# This file defines THE EXACT METHOD for acquiring each required dataset.
# NOT A FALLBACK LIST. A CANONICAL ALGORITHM.
# Different AI models following this contract get identical data.

test_mode_activation:
  rule: >
    TEST_MODE can ONLY be activated by explicit user request with keywords:
    "test", "fixture", "mock-data", "TEST_MODE", or "use test data"

    If user does NOT explicitly request test mode, use PRODUCTION mode.
    PRODUCTION mode requires live GitHub/Sheets sources (will STOP if unavailable).

  test_mode_behavior: >
    When explicitly activated:
    - Read merged_prs from fixtures/merged_prs_sample.json
    - Read active_issues from fixtures/active_issues_sample.json
    - Record in DATA_ACQUISITION_RECEIPT: source = "FIXTURE (test mode)"
    - Proceed through gates, modular composition, render, delivery
    - Add footer to presentation: "⚠️ TEST MODE — fixture data"

  production_mode_behavior: >
    When NOT in test mode (default):
    - Use live GitHub API, GitHub web, Google Sheets per fallback_order
    - STOP if any required source fails (do not substitute fixtures)
    - Report DATA_ACQUISITION_RECEIPT with real source diagnostics

required_datasets:
  team_roster:
    canonical_method: "Read TEAM_ROSTER.md file locally"
    requirement: 7 members
    fields:
      - name
      - github_username
      - team_designation
    stop_condition: "any member missing or unverifiable"
    fallback: "None — local file is authoritative"

  merged_prs:
    source_id: "GITHUB_MERGED_PRS"
    reference: "EXTERNAL_SOURCES.yaml: GITHUB_MERGED_PRS (canonical source of truth for URL, access methods, fallback chain)"

    allowed_access_methods:
      - "github_connector (preferred)"
      - "github_api (direct HTTPS GET)"

    primary_method_binding: "EXTERNAL_SOURCES.yaml defines primary.method = github_connector. This is BINDING and MUST be used first. Do NOT use github_api unless primary fails."

    forbidden_access_methods:
      - "web_search"
      - "general_web_access"
      - "raw_github (raw.githubusercontent.com)"
      - "csv_export"

    enforcement:
      rule: >
        For CANONICAL (primary) source: MUST use only [github_connector, github_api].
        For FALLBACKS: github_web and google_drive_connector are explicitly allowed (see fallback_chain).
        Do NOT attempt web_search, raw GitHub, or CSV export for this dataset.
      on_violation: "STOP. Report: forbidden access method attempted for merged_prs canonical source"

    fallback_chain:
      1: "See EXTERNAL_SOURCES.yaml: GITHUB_MERGED_PRS.fallbacks[0] (github_web) — allowed when primary fails"
      2: "See EXTERNAL_SOURCES.yaml: GITHUB_MERGED_PRS.fallbacks[1] (google_drive_connector on GOOGLE_PROJECT_DATA_SHEET) — allowed when github_web fails"

    pagination:
      required: true
      stop_when: "response contains < per_page results"
      collect_all: true

    local_filter:
      - "merged_at != null (CRITICAL: exclude unmerged PRs)"
      - "merged_at >= REPORTING_PERIOD_START"
      - "merged_at < REPORTING_PERIOD_END"
      - "base.ref == 'develop' (only develop branch)"
      - "use assignees[] for attribution (person who worked on code, not merger)"

    verification_only:
      - "Individual PR pages (verification only, not for completeness discovery)"

    requirement: "ALL merged PRs in reporting period"
    fields:
      - id (PR number)
      - title
      - assignees[] (CRITICAL: who worked on this PR, not who merged it)
      - merged_at (timestamp)
      - base.ref
      - linked_issues (if available)

    CRITICAL_RULE: >
      Show PR by ASSIGNEE (person who worked on the code), NOT by merger.
      If PR has multiple assignees: list all.
      If no assignee: show "??" + suggest owner based on:
        1. Previous commits on similar code areas
        2. Team accountability patterns (long continuous chains vs load distribution)
        3. Who has capacity (avoid overload)
      This prompts meeting decision: "Vem tar ansvar för denna?"

    stop_condition: "source fails AND all fallbacks fail (use DATA_AUDIT to confirm)"

  active_issues:
    source_id: "GITHUB_OPEN_ISSUES"
    reference: "EXTERNAL_SOURCES.yaml: GITHUB_OPEN_ISSUES (canonical source of truth for URL, access methods, fallback chain)"

    allowed_access_methods:
      - "github_connector (preferred)"
      - "github_api (direct HTTPS GET)"

    primary_method_binding: "EXTERNAL_SOURCES.yaml defines primary.method = github_connector. This is BINDING and MUST be used first. Do NOT use github_api unless primary fails."

    forbidden_access_methods:
      - "web_search"
      - "general_web_access"
      - "raw_github (raw.githubusercontent.com)"
      - "csv_export"

    enforcement:
      rule: >
        For CANONICAL (primary) source: MUST use only [github_connector, github_api].
        For FALLBACKS: github_web and google_drive_connector are explicitly allowed (see fallback_chain).
        Do NOT attempt web_search, raw GitHub, or CSV export for this dataset.
      on_violation: "STOP. Report: forbidden access method attempted for active_issues canonical source"

    fallback_chain:
      1: "See EXTERNAL_SOURCES.yaml: GITHUB_OPEN_ISSUES.fallbacks[0] (github_web) — allowed when primary fails"
      2: "See EXTERNAL_SOURCES.yaml: GITHUB_OPEN_ISSUES.fallbacks[1] (google_drive_connector on GOOGLE_PROJECT_DATA_SHEET) — allowed when github_web fails"

    pagination:
      required: true
      stop_when: "response contains < per_page results"
      collect_all: true

    local_filter:
      - "exclude if key 'pull_request' exists (API includes pull requests; filter them out)"
      - "assignees.length > 0 (only issues with assigned owner)"
      - "updated_at >= REPORTING_PERIOD_START"
      - "updated_at < REPORTING_PERIOD_END"

    requirement: "ALL open issues with activity in reporting period, assigned to someone"
    fields:
      - id (issue number)
      - title
      - assignees[] (array of assignee objects)
      - updated_at (timestamp)
      - labels[] (for team classification)

    stop_condition: "source fails AND all fallbacks fail (use DATA_AUDIT to confirm)"

reporting_period:
  definition: "7 calendar days (one full week)"
  timezone: "Europe/Stockholm"
  format: "meeting_date - 7 days at 00:00 (inclusive) through meeting_date at 00:00 (exclusive)"

  AUTHORITATIVE_DEFINITION: |
    REPORTING_PERIOD_START = meeting_date at 00:00 minus 7 calendar days (inclusive)
    REPORTING_PERIOD_END = meeting_date at 00:00 (exclusive)
    Example: Meeting on Monday 2026-09-22
      START: 2026-09-15 00:00 Europe/Stockholm (Monday one week prior)
      END: 2026-09-22 00:00 Europe/Stockholm (meeting date at midnight)
      Coverage: All work completed between these timestamps

  compare_fields:
    merged_pr: "merged_at"
    open_issue: "updated_at"

endpoint_failure_vs_data_completeness:
  principle: >
    ENDPOINT_FAILURE is not DATA_FAILURE.

    If GitHub API fails, try GitHub web.
    If GitHub web fails, try fallback sources.
    If all sources fail, DATA_AUDIT marks dataset as INCOMPLETE.

    STOP RENDERING only if:
      team_roster.complete == false
      OR merged_prs.complete == false
      OR active_issues.complete == false

    Otherwise: render with available data, mark sources in footer.

validation_rules:
  merged_prs_minimum: "At least 1, or mark week as 'no merged work'"
  active_issues_minimum: "At least 1, or mark week as 'no open work'"
  team_roster: "Exactly 7, or STOP"

  rule: "Zero activity in a category is valid. Missing data sources are not."

###############################################################################
# DATA_ACQUISITION_RECEIPT — Machine-Readable Diagnostic Logging
###############################################################################
data_acquisition_receipt:
  purpose: >
    Log exact status per source for each required dataset.
    Enable diagnosis of why DATA_AUDIT passed or failed.
    Must record source URL, status, failure_reason, and payload_summary.

  required_structure:
    execution_id: "Links to EXECUTION_RECEIPT_MACHINE.execution_id"
    attempted_at: "ISO 8601 timestamp when acquisition began"
    reporting_period: "REPORTING_PERIOD_START ... REPORTING_PERIOD_END"

  per_dataset_log:
    dataset_name: "team_roster | merged_prs | active_issues"
    canonical_source: "Primary source (e.g., 'GitHub API /repos/.../pulls')"

    sources_tested_array:
      - source_url: "Full URL attempted (including query params)"
        http_method: "GET | POST | etc"
        status: "SUCCESS | HTTP_ERROR | AUTH_ERROR | TIMEOUT | EMPTY_RESPONSE | PARSE_ERROR | TOOL_UNAVAILABLE"
        http_code: "200 | 403 | 404 | 401 | 500 | null (if tool unavailable)"
        failure_reason: "Human-readable description if status != SUCCESS"
        payload_summary: "Number of items returned, or 'empty', or parse error details"
        tried_at: "ISO 8601 timestamp"
        fallback_reason: "If trying next source: why previous failed (e.g., 'API rate limit exceeded')"

    selected_source: "Which source was finally used"
    final_status: "SUCCESS | INCOMPLETE"
    final_payload_count: "Number of items acquired"

    rule: >
      If final_status == INCOMPLETE: must list all attempted sources with their statuses.
      If final_status == SUCCESS: must document selected_source and payload_count.
      Never omit failure_reason — it is how future runs know what to fix.

  example_log:
    dataset: "merged_prs"
    source_id: "GITHUB_MERGED_PRS (see EXTERNAL_SOURCES.yaml for actual URL)"
    sources_tested:
      - source: "GITHUB_MERGED_PRS.primary (github_connector)"
        status: "HTTP_ERROR"
        http_code: 403
        failure_reason: "API rate limit exceeded (X-RateLimit-Remaining: 0)"
        tried_at: "2026-09-15T10:30:45Z"

      - source: "GITHUB_MERGED_PRS.fallbacks[0] (github_web, see EXTERNAL_SOURCES.yaml)"
        status: "EMPTY_RESPONSE"
        failure_reason: "Web page loaded but no PR data extracted (selector mismatch or page layout changed)"
        tried_at: "2026-09-15T10:31:12Z"
        fallback_reason: "GitHub API rate-limited, trying web fallback"

      - source: "GITHUB_MERGED_PRS.fallbacks[1] (google_drive_connector on GOOGLE_PROJECT_DATA_SHEET, see EXTERNAL_SOURCES.yaml)"
        status: "AUTH_ERROR"
        http_code: 403
        failure_reason: "Permission denied on Google Sheets (Sheet not shared with connector, or token expired)"
        tried_at: "2026-09-15T10:31:45Z"
        fallback_reason: "GitHub web fallback failed, trying Sheets"

    final_status: "INCOMPLETE"
    selected_source: "none (all failed)"

    diagnostic: >
      All three sources failed. API: rate-limited. Web: selector mismatch (possible GitHub UI change).
      Sheets: permission denied. Suggest: check API key renewal, verify web scraping selectors,
      verify Sheets sharing permissions and connector authentication.

  gate_rule: >
    If ANY required_dataset has final_status == INCOMPLETE:
      → DATA_AUDIT marks that dataset as INCOMPLETE
      → Presentation generation STOPS (per SYSTEM_CONTRACT.yaml)
      → MUST report to user the COMPLETE sources_tested_array (all attempts), not just last failure
      → Format:
         [dataset] acquisition INCOMPLETE. Sources tried:
         1. [source_url]: [status] [http_code] — [failure_reason]
         2. [source_url]: [status] [http_code] — [failure_reason]
         3. [source_url]: [status] [http_code] — [failure_reason]

         This enables diagnosis: rate limiting (429), auth (401/403), DNS errors, timeouts, etc.

    Else:
      → DATA_AUDIT proceeds
      → DATA_AUDIT checksums verify completeness
      → build_gate may proceed

  terminal_vs_data_problems: >
    ENDPOINT_FAILURE (DNS, TERM variable, path issues, network timeout) ≠ DATA_FAILURE.

    If a terminal/shell problem occurs (TERM not set, environment variable missing),
    and registered fallbacks remain untried, continue to next fallback source.

    Do NOT classify shell/terminal errors as "data unavailable".
    Continue through all registered fallbacks per DATA_ACQUISITION_CONTRACT.yaml.

    Only after ALL registered fallbacks fail with actual data-fetch attempts does
    final_status = INCOMPLETE become valid.
