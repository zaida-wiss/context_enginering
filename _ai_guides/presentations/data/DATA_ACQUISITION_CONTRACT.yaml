---
name: data_acquisition_contract
description: Canonical acquisition method for required datasets — deterministic, no interpretation
metadata:
  type: process
  critical: true
  version: 1.0
---

# DATA ACQUISITION CONTRACT
#
# This file defines THE EXACT METHOD for acquiring each required dataset.
# NOT A FALLBACK LIST. A CANONICAL ALGORITHM.
# Different AI models following this contract get identical data.

required_datasets:
  team_roster:
    canonical_method: "Read TEAM_ROSTER.md file locally"
    requirement: 7 members
    fields:
      - name
      - github_username
      - team_designation
    stop_condition: "any member missing or unverifiable"
    fallback: "None — local file is authoritative"

  merged_prs:
    canonical_method:
      endpoint: "/repos/chas-challenge-2026/avanza-team1/pulls"
      http_method: "GET"
      params:
        state: "closed"
        base: "develop"
        per_page: 100

      pagination:
        required: true
        stop_when: "response contains < per_page results"
        collect_all: true

      local_filter:
        - "merged_at != null"
        - "merged_at >= REPORTING_PERIOD_START"
        - "merged_at < REPORTING_PERIOD_END"
        - "base.ref == 'develop'"

    fallback_order:
      1: "GitHub web: https://github.com/chas-challenge-2026/avanza-team1/pulls?q=is:pr+is:merged"
      2: "Repository home + manual /pulls navigation: https://github.com/chas-challenge-2026/avanza-team1"
      3: "Google Sheets: see EXTERNAL_SOURCES.md"

    verification_only:
      - "Individual PR pages (verification only, not for completeness discovery)"

    requirement: "ALL merged PRs in reporting period"
    fields:
      - id (PR number)
      - title
      - assignees[] (CRITICAL: who worked on this PR, not who merged it)
      - merged_at (timestamp)
      - base.ref
      - linked_issues (if available)

    CRITICAL_RULE: >
      Show PR by ASSIGNEE (person who worked on the code), NOT by merger.
      If PR has multiple assignees: list all.
      If no assignee: show "??" + suggest owner based on:
        1. Previous commits on similar code areas
        2. Team accountability patterns (long continuous chains vs load distribution)
        3. Who has capacity (avoid overload)
      This prompts meeting decision: "Vem tar ansvar för denna?"

    stop_condition: "source fails AND all fallbacks fail (use DATA_AUDIT to confirm)"

  active_issues:
    canonical_method:
      endpoint: "/repos/chas-challenge-2026/avanza-team1/issues"
      http_method: "GET"
      params:
        state: "open"
        per_page: 100

      pagination:
        required: true
        stop_when: "response contains < per_page results"
        collect_all: true

      local_filter:
        - "exclude if key 'pull_request' exists in object"
        - "assignees.length > 0"
        - "updated_at >= REPORTING_PERIOD_START"
        - "updated_at < REPORTING_PERIOD_END"

    fallback_order:
      1: "GitHub web: https://github.com/chas-challenge-2026/avanza-team1/issues?q=is:open"
      2: "Google Sheets: see EXTERNAL_SOURCES.md"
      3: "Project Board: reconstruct from column view"

    requirement: "ALL open issues with activity in reporting period, assigned to someone"
    fields:
      - id (issue number)
      - title
      - assignees[] (array of assignee objects)
      - updated_at (timestamp)
      - labels[] (for team classification)

    stop_condition: "source fails AND all fallbacks fail (use DATA_AUDIT to confirm)"

reporting_period:
  definition: "7 days prior to meeting time through meeting time (exclusive), Europe/Stockholm"
  timezone: "Europe/Stockholm"
  meeting_time: "Monday 09:00"

  calculation:
    REPORTING_PERIOD_START: "meeting_date at 09:00 minus 7 calendar days, Europe/Stockholm (inclusive)"
    REPORTING_PERIOD_END: "meeting_date at 09:00 Europe/Stockholm (exclusive)"

  example:
    meeting_date: "2026-09-22 (Monday)"
    REPORTING_PERIOD_START: "2026-09-15 09:00 Europe/Stockholm (last Monday 09:00)"
    REPORTING_PERIOD_END: "2026-09-22 09:00 Europe/Stockholm (this Monday 09:00, not included)"
    coverage: "Work completed between these two timepoints"

  compare_fields:
    merged_pr: "merged_at"
    open_issue: "updated_at"

endpoint_failure_vs_data_completeness:
  principle: >
    ENDPOINT_FAILURE is not DATA_FAILURE.

    If GitHub API fails, try GitHub web.
    If GitHub web fails, try fallback sources.
    If all sources fail, DATA_AUDIT marks dataset as INCOMPLETE.

    STOP RENDERING only if:
      team_roster.complete == false
      OR merged_prs.complete == false
      OR active_issues.complete == false

    Otherwise: render with available data, mark sources in footer.

validation_rules:
  merged_prs_minimum: "At least 1, or mark week as 'no merged work'"
  active_issues_minimum: "At least 1, or mark week as 'no open work'"
  team_roster: "Exactly 7, or STOP"

  rule: "Zero activity in a category is valid. Missing data sources are not."

###############################################################################
# DATA_ACQUISITION_RECEIPT — Machine-Readable Diagnostic Logging
###############################################################################
data_acquisition_receipt:
  purpose: >
    Log exact status per source for each required dataset.
    Enable diagnosis of why DATA_AUDIT passed or failed.
    Must record source URL, status, failure_reason, and payload_summary.

  required_structure:
    execution_id: "Links to EXECUTION_RECEIPT_MACHINE.execution_id"
    attempted_at: "ISO 8601 timestamp when acquisition began"
    reporting_period: "REPORTING_PERIOD_START ... REPORTING_PERIOD_END"

  per_dataset_log:
    dataset_name: "team_roster | merged_prs | active_issues"
    canonical_source: "Primary source (e.g., 'GitHub API /repos/.../pulls')"

    sources_tested_array:
      - source_url: "Full URL attempted (including query params)"
        http_method: "GET | POST | etc"
        status: "SUCCESS | HTTP_ERROR | AUTH_ERROR | TIMEOUT | EMPTY_RESPONSE | PARSE_ERROR | TOOL_UNAVAILABLE"
        http_code: "200 | 403 | 404 | 401 | 500 | null (if tool unavailable)"
        failure_reason: "Human-readable description if status != SUCCESS"
        payload_summary: "Number of items returned, or 'empty', or parse error details"
        tried_at: "ISO 8601 timestamp"
        fallback_reason: "If trying next source: why previous failed (e.g., 'API rate limit exceeded')"

    selected_source: "Which source was finally used"
    final_status: "SUCCESS | INCOMPLETE"
    final_payload_count: "Number of items acquired"

    rule: >
      If final_status == INCOMPLETE: must list all attempted sources with their statuses.
      If final_status == SUCCESS: must document selected_source and payload_count.
      Never omit failure_reason — it is how future runs know what to fix.

  example_log:
    dataset: "merged_prs"
    sources_tested:
      - source_url: "https://api.github.com/repos/chas-challenge-2026/avanza-team1/pulls?state=closed&base=develop&per_page=100"
        status: "HTTP_ERROR"
        http_code: 403
        failure_reason: "API rate limit exceeded (X-RateLimit-Remaining: 0)"
        tried_at: "2026-09-15T10:30:45Z"

      - source_url: "https://github.com/chas-challenge-2026/avanza-team1/pulls?q=is:pr+is:merged"
        status: "EMPTY_RESPONSE"
        failure_reason: "Web page loaded but no PR data extracted (selector mismatch or page layout changed)"
        tried_at: "2026-09-15T10:31:12Z"
        fallback_reason: "GitHub API rate-limited, trying web fallback"

      - source_url: "https://docs.google.com/spreadsheets/d/SHEET_ID/export?format=csv&gid=0"
        status: "AUTH_ERROR"
        http_code: 403
        failure_reason: "Permission denied on Google Sheets (Sheet not shared with connector, or token expired)"
        tried_at: "2026-09-15T10:31:45Z"
        fallback_reason: "GitHub web fallback failed, trying Sheets"

    final_status: "INCOMPLETE"
    selected_source: "none (all failed)"

    diagnostic: >
      All three sources failed. API: rate-limited. Web: selector mismatch (possible GitHub UI change).
      Sheets: permission denied. Suggest: check API key renewal, verify web scraping selectors,
      verify Sheets sharing permissions and connector authentication.

  gate_rule: >
    If ANY required_dataset has final_status == INCOMPLETE:
      → DATA_AUDIT marks that dataset as INCOMPLETE
      → Presentation generation STOPS (per SYSTEM_CONTRACT.yaml)
      → Report to user: "[dataset] acquisition failed. Last attempt [tried_at]. Reason: [failure_reason]."

    Else:
      → DATA_AUDIT proceeds
      → DATA_AUDIT checksums verify completeness
      → build_gate may proceed
