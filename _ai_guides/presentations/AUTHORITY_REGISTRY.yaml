name: presentation_authority_registry
description: Canonical registry of active authorities, validators, references and retired guides
version: 1.5
metadata:
  type: registry
  critical: true
  status: active

rule: >
  Files listed under active_authorities are the canonical owners of presentation
  rules. Validators verify those rules. References illustrate them. Retired files
  remain historical material outside the production task bundle.

bootstrap_and_navigation:
  rule: >
    Entry, registry and navigation files that connect the presentation system but
    do not own presentation behavior by themselves.
  files:
    - AUTHORITY_REGISTRY.yaml
    - MANDATORY_READING_ORDER.md
    - README.md
    - monday_meeting/README.md

active_authorities:
  - rank: 1
    file: INTEGRITY_CONSTRAINT.md
    category: data_integrity
    owns: verified-data semantics, explicit unknown/incomplete states and factual trust boundary
  - rank: 2
    file: SYSTEM_CONTRACT.yaml
    category: orchestration
    owns: execution sequence, gates, STOP/CONTINUE and delivery
  - rank: 3
    file: design/ACCESSIBILITY_NEURODIVERSITY.md
    category: accessibility
    owns: WCAG 2.2 AA, neurodiversity and absolute readability boundary
  - rank: 4
    file: design/VISUAL_DESIGN_MANDATORY.md
    category: global_visual
    owns: palette, slide-level visual roles, layouts and column/grid structure
  - rank: 5
    file: design/READABILITY_HARD_RULES.md
    category: readability
    owns: readable type minima, line spacing, meeting-point glyphs and pedagogical clarity
  - rank: 6
    file: design/CARD_COMPONENT_STANDARD.md
    category: card_component
    owns: card internals, identity rows, metadata, timestamps and card spacing
  - rank: 7
    file: design/PROVENANCE_AND_AI_LABELING.md
    category: provenance
    owns: source classes, canonical symbols and mixed-source labeling
  - rank: 8
    file: data/PR_MERGE_REVIEW_IDENTITY.md
    category: pr_identity
    owns: merger and submitted-review acquisition and rendering semantics
  - rank: 9
    file: monday_meeting/design/LAYOUT_OVERFLOW_GUARD.md
    category: responsive_fit
    owns: fit algorithm, pagination and collision prevention
  - rank: 10
    file: monday_meeting/structure/COMPOSITION_ARCHITECTURE.md
    category: composition_structure
    owns: meeting-point order, presence/empty states, cross-slide red threads and composition completeness
  - rank: 11
    file: monday_meeting/design/SLIDE_DETAIL_SPEC.md
    category: slide_content
    owns: meeting-point purpose, required fields and content order
  - rank: 12
    file: data/DATA_ACQUISITION_CONTRACT.yaml
    category: acquisition
    owns: mechanical data acquisition and reporting-period filtering
  - rank: 13
    project_resolved: presentation_authority
    resolve_via: "../../PROJECTS.yaml -> selected project manifest -> context.presentation.authority.path"
    category: project_presentation
    owns: project-specific presentation composition, geometry and project semantics
  - rank: 14
    project_resolved: source_registry
    resolve_via: "../../PROJECTS.yaml -> selected project manifest -> context.sources.path"
    category: source_registry
    owns: allowed sources, URLs, access methods and fallback order

validators:
  - verification/RENDER_GATE_CHECKLIST.md
  - ../../_audit/rendered_presentation_audit.py
  - design/DESIGN_AUTHORITY.md
  - ARCHITECTURE.md

cross_domain_dependencies:
  rule: >
    Active reusable guidance outside the presentation folder that presentation
    tasks may consume. These files do not replace presentation-specific owners.
  files:
    - ../COGNITIVE_ACCESSIBILITY_NEUROINCLUSIVE_DESIGN.md
    - ../AI_BEST_PRACTICE_EVIDENCE_POLICY.yaml

supporting_processes:
  rule: >
    Active process/schema files required by acquisition and sprint-context
    execution. They support active authorities and must remain explicitly
    registered so refactors cannot orphan them.
  files:
    - data/CURRENT_SPRINT_SCHEMA.yaml
    - data/DATA_COLLECTION_MANDATORY.md

supporting_data_models:
  rule: >
    These files support data classification and diagnostics. Presentation rule
    categories remain owned by the active authorities above.
  files:
    - data/ACTIVE_WORK_DETECTION_MODEL.md
    - data/DATA_SOURCES.md
    - data/DATA_VALIDATION_SCHEMA.yaml
    - models/DEPENDENCY_CHAIN_PLANNING.md
    - models/REPO_FIRST_RECONSTRUCTION.md
    - models/WEEKLY_PROGRESS_MODEL.md
    - TEST_MODE.md

references:
  - monday_meeting/design/TEMPLATE_REFERENCE.html

retired_guides:
  - monday_meeting/data/DATA_COLLECTION_MANDATORY.md

retired_history_note: >
  Retired guides that have been safely removed are preserved by Git history,
  not as live production paths. Before deletion, unique useful rules must be
  migrated to the correct active authority.

retired_rule: >
  Retired guides are historical context outside the production task bundle.
  Useful historical content is migrated into the correct active authority before
  it becomes part of current presentation behavior.

conflict_rule: >
  If two active authorities contain incompatible requirements, STOP immediately.
  Inform the user of the exact conflicting rules, identify the owning files,
  explain the concrete consequence of each alternative, and ask the user to
  choose before changing either rule or rendering further. Authority rank must
  never be used to silently resolve a genuine contradiction. Record the user's
  decision in the owning context authority and regression tests before continuing.
