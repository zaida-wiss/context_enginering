###############################################################################
# SYSTEM CONTRACT — Maskinläsbar definition av presentationspipelinen
#
# Detta YAML-block är källan till sanning för vilken AI som helst
# Läs denna direkt efter MANDATORY_READING_ORDER.md
# Denna fil är därefter enda auktoritet för execution order och authority
###############################################################################

task: monday_meeting_presentation
version: 3.0
last_updated: 2026-09-16

# All paths relative to repo root, under this base directory:
base_path: "_ai_guides/presentations"

###############################################################################
# PLATFORM HANDOFF — Preflight operation (NOT a gate)
###############################################################################
platform_handoff:
  classification: "preflight_only"
  creates_artifact: false
  satisfies_no_gate: true

  rule: >
    Platform-required presentation handoff may occur before execution_receipt.
    A successful handoff MUST NOT be interpreted as permission to build,
    render, or collect project data.

  required_next_step: >
    Immediately continue with README.md → snapshot-SHA registration →
    MANDATORY_READING_ORDER.md → SYSTEM_CONTRACT.yaml →
    execution_sequence step_1.

  failure_prevention: >
    Handoff does not establish execution_receipt, build_gate,
    data_audit, or delivery_gate. It is a preflight-only operation.
    No presentation building occurs until execution_receipt PASSES.

  receipt_logging:
    event: "platform_handoff_completed"
    status: "COMPLETED"
    note: "Preflight operation only; no gate satisfied; no artifact created."

###############################################################################
# EXECUTION LIFECYCLE — Explicit definition to prevent interpretation variance
###############################################################################
execution_lifecycle:
  starts: "When user requests new presentation"
  receives: "Unique execution_id (e.g., 'exec_20260916_001')"
  continues: "Through subsequent chat turns until DELIVER, STOP, or RESTART"
  ends: "At DELIVER (artifact delivered), STOP (terminated), or RESTART (new execution_id)"
  invalidates: "Any resume after STOP requires NEW execution from README (not from cached state)"
  no_reuse: "old receipts, old execution_ids, other execution contexts"

###############################################################################
# EXECUTION_RECEIPT_MACHINE — Machine-readable verification structure
###############################################################################
execution_receipt_machine:
  required_fields:
    - execution_id: "Unique identifier for this execution run (e.g., 'exec_20260916_001')"
    - started_at: "ISO 8601 timestamp when execution began (e.g., '2026-09-16T14:30:00Z')"
    - repo_commit_sha: "Git commit SHA at README read (snapshots repo version for determinism)"

  files_read_array:
    - path: "Path to file in repo"
    - blob_sha: "Git blob SHA of file at this execution (proves version consistency)"
    - read_at: "ISO 8601 timestamp when file was read"
    - status: "'CONFIRMED' if read and verified, 'SKIPPED' if intentionally skipped"

  gates_passed_array:
    - gate_name: "Name of gate (e.g., 'execution_receipt', 'instruction_audit', 'data_acquisition_receipt', 'data_audit')"
    - status: "'PASS' or 'FAIL'"
    - verified_at: "ISO 8601 timestamp when gate was verified"

  purpose: "Make AI execution verifiable: models cannot just say 'READ' — it becomes a checksum against repo version"

###############################################################################
# NON-NEGOTIABLE EXECUTION RULE
###############################################################################
non_negotiable_execution:
  - "READ MANDATORY_READING_ORDER.md first (routes to this file)"
  - "AUDIT data collection second (DATA_AUDIT before slides)"
  - "BUILD slides third (following SLIDE_DETAIL_SPEC)"
  - "RENDER and verify fourth (VISUAL_DESIGN_MANDATORY + RENDER_GATE)"
  - "DELIVER last (PDF by default, PPTX if explicitly requested)"
  - "⚠️ No artifact tool may be invoked before READ and AUDIT are complete"

###############################################################################
# AUTHORITY HIERARCHY — Single Source Per Domain (ZERO DUPLICATION)
# Revised 2026-09-16: Clarified roles to distinguish between requirements, implementation, and content
###############################################################################
authority:
  execution_and_contract:
    file: "SYSTEM_CONTRACT.yaml (this file)"
    owns: "Execution sequence, process, gates, required vs optional data, when to STOP, delivery format"
    role: "Overarching orchestration and conflict resolution"

  slide_structure_and_content:
    file: "monday_meeting/design/SLIDE_DETAIL_SPEC.md (🚨 CRITICAL)"
    owns: "Which slides exist, their order, meeting-point symbols (①-⑭), slide titles, required content per slide, continuation rules"
    rule: "This is the SLIDE BLUEPRINT. Other files may style but CANNOT rename, reorder, merge, or omit slides unless explicitly permitted here"
    does_not_own: "Visual design, layout, typography (those belong to VISUAL_DESIGN_MANDATORY)"

  accessibility_and_neurodiversity:
    file: "design/ACCESSIBILITY_NEURODIVERSITY.md (🚨 CRITICAL)"
    owns: "Quality requirements that design MUST meet: NPF principles, color semantics, symbol consistency, cognitive load, whitespace, large text, low visual density"
    role: "BOUNDARY CONDITIONS — these are non-negotiable constraints that visual design must never violate"
    wins_over: "Nothing, because it defines minimum quality, not implementation"
    note: "Defines WHY and WHAT MUST BE, not HOW to build it"

  visual_design_implementation:
    file: "design/VISUAL_DESIGN_MANDATORY.md (AUTHORITATIVE)"
    owns: "ENDA source of truth for exakt layout, form, typography, spacing, margins, block structure, PowerPoint implementation, rounded corners vs rectangles, color placement"
    must_implement: "All ACCESSIBILITY_NEURODIVERSITY.md requirements"
    rule: "If this conflicts with SLIDE_DETAIL_SPEC (content), VISUAL_DESIGN_MANDATORY wins on form; if conflicts with ACCESSIBILITY_NEURODIVERSITY, revise to meet accessibility first"
    note: "Defines HOW to build within quality boundaries"

  external_sources_registry:
    file: "_memory/EXTERNAL_SOURCES.yaml (AUTHORITATIVE)"
    owns: "Single source of truth for: all external data sources, source IDs, URLs, access methods, allowed/forbidden implementations, fallback chains, source classifications (REQUIRED/OPTIONAL/FALLBACK)"
    rule: "This is the ONLY file that defines fallback order. DATA_ACQUISITION_CONTRACT references it, never duplicates"
    note: "Owns the 'what' and 'in what order' for data acquisition fallbacks"

  data_acquisition:
    file: "data/DATA_ACQUISITION_CONTRACT.yaml"
    owns: "EXACT canonical algorithm, pagination, filtering, dataset structure (mechanical, no decisions)"
    references_not_owns: "fallback order (see EXTERNAL_SOURCES.yaml for authoritative fallback chains)"
    note: "Specifies HOW to execute; EXTERNAL_SOURCES specifies WHAT sources exist and WHEN to try each"

  data_collection:
    file: "monday_meeting/data/DATA_COLLECTION_MANDATORY.md"
    owns: "Validation, audit structure, completeness checking"

  visual_reference:
    file: "monday_meeting/design/TEMPLATE_REFERENCE.html"
    owns: "Illustrations of the visual result only"
    does_not_own: "Any rule, value, or constraint (reference only; NEVER authoritative)"

  verification_and_quality:
    file: "verification/RENDER_GATE_CHECKLIST.md"
    owns: "Verification checkpoints before delivery"

###############################################################################
# REPOSITORY REF POLICY — Branch Inheritance (CRITICAL)
###############################################################################
repository_ref_policy:
  rule: >
    The repository ref used to read the entry README is the authoritative
    ref for the entire execution. ALL internal repository files must be read
    from this same ref. Never silently switch to the default branch.

  execution_ref:
    source: "ref (branch/tag/SHA) of the README that started this execution"
    applies_to: "Every internal file read during this execution"

  requirements:
    - "Read EVERY internal repository file from execution_ref (same branch as entry README)"
    - "Never silently switch to repository default branch mid-execution"
    - "External project data may come from registered sources as defined separately"
    - "If a required internal file does not exist on execution_ref: STOP and report missing file"
    - "Do NOT fetch the file from main/default as fallback"

  fallback_behavior:
    rule: >
      If a required internal file does not exist on the execution_ref,
      STOP immediately and report the missing file. Do not fetch from default.

  example_correct_flow: >
    cleanup/README.md → cleanup/SYSTEM_CONTRACT.yaml →
    cleanup/SLIDE_DETAIL_SPEC.md → cleanup/VISUAL_DESIGN_MANDATORY.md → etc.
    (All from cleanup branch, never jumping to main)

  why_this_matters: >
    This enables isolated testing and development on feature branches
    without accidental fallback to main. cleanup branch must be testable
    before merge to main.

###############################################################################
# PRESENTATION ANALYSIS LAYER — Recommendations Beyond Status Reporting
###############################################################################
analysis_and_recommendations:
  principle: >
    Presentation is NOT just status reporting (what happened this week).
    It MUST also include analysis (what should we do next, in what order, how to parallelize).

  required_analysis_elements:
    priority_recommendation: >
      MUST rank work by impact/risk/dependencies.
      Not just "these 5 things are open" — "do THESE 3 first because [X] blocks [Y]".

      Example:
        🔴 #67 Update API contract (FIRST — blocks Frontend + Native)
        🟠 #72 Frontend state management (SECOND — depends on #67)
        🟡 #84 Database optimization (THIRD — independent, lower priority)

    dependency_chain: >
      MUST show which issues block others.
      Format: #X blocks #Y blocks #Z

      Allows team to parallelize: "While you wait for #67 review,
      start #84 (independent) + #73 (prep work for #72)".

    team_capacity_and_split: >
      MUST recommend how to divide work across teams.

      Example:
        ✅ Frontend: Take #72 (UI) + #84-prep (infra setup)
        ✅ Backend: Take #67 (API contract) + #73 (database)
        ✅ Native: Wait for #67 → then take cross-team integration

      This prevents: "Everyone works on the same thing" or "Idle capacity".

    estimated_completion_and_risk: >
      MUST estimate when work can be DONE (not just started).

      Example:
        #67 API: 2 days (no blockers)
        #72 Frontend: 3 days (after #67 done)
        #84 Database: 2 days (parallel to #72)
        → Full feature ready in 5 days (critical path)
        → Risk: If API review takes 1+ day → 6+ days total

    actionable_next_steps: >
      MUST end presentation with explicit NEXT STEPS.

      Example:
        TODAY:
          - Erik: Start #67 API contract (priority 1)
          - Zaida: Prep #84 database infra (priority 3, independent)
          - Björn: Review yesterday's PRs

        AFTER #67 merged:
          - Zaida: Start #72 state management
          - Pär: Begin cross-team integration #89

        By Friday:
          - All work merged to Java-Development-Environment
          - CTO demo ready

  data_sources_required:
    - github_issues: dependencies, blockers, linked issues
    - github_prs: review status, which PRs block what
    - team_roster: who can work on what
    - commit_history: effort indicators (how long did similar work take)
    - project_board: if available, status/iteration info

  analysis_vs_reporting:
    reporting: >
      "Here's what happened this week"
      ← Passive, backward-looking

    analysis: >
      "Here's what should happen next, in this order, split like this"
      ← Active, forward-looking, actionable

  recommendation_algorithm:
    principle: >
      Balance THREE goals simultaneously:
      1. OWNERSHIP COHESION — keep related work with same person (domain expertise)
      2. LOAD BALANCING — spread work evenly across team
      3. ABSENCE HANDLING — adjust for planned/actual absence (sick leave, vacation)

    step_1_identify_related_issues: >
      Group issues by "area" (component, feature, code domain):
        - Related issues: same component, same code area, same feature branch prefix
        - Example: #72, #78, #89 all in "Frontend state management" → group together
        - Example: #67, #73, #84 all in "Database/Backend" → group together

    step_2_assign_current_owner: >
      Who's already working in this area?
        - If Zaida is doing #72 (state management) → assign next related issue #78 to Zaida
        - If Erik is doing #67 (API) → assign #73 to Erik (same area)
        - Rationale: Zaida knows state management already, reduces context-switch cost

    step_3_calculate_working_capacity: >
      For EACH team member:
        base_capacity = 5 days per week
        - Subtract planned absence (vacation on calendar?)
        - Subtract current open work (if 3 issues open → estimate time)
        - Result: "Zaida has 2 days capacity this week, Erik has 3 days"

    step_4_balance_workload: >
      Assign related issues to current owner IF:
        ✅ Related work exists in their area
        ✅ They have remaining capacity
        ✅ It doesn't overload them relative to team average

      ELSE (if overloaded):
        - Pass related work to SECOND-best owner (someone with time + familiarity)
        - Never leave someone idle while others are overloaded

    step_5_absence_override: >
      If someone is out next week:
        - Their current work → handoff to similar-skilled colleague
        - New assignments → redirect to available people
        - Update capacity estimate: "Erik absent Mon-Tue, capacity = 3 days"

    output_recommendation: >
      Example output:
        Zaida (capacity: 2 days): #72 (state mgmt), #78 (state mgmt) — cohesive area
        Erik (capacity: 3 days): #67 (API), #73 (DB) — sequential, 2.5 days each
        Björn (capacity: 1.5 days): #84 (infra) — independent work
        Pär (capacity: ABSENT Mon-Tue, 2 days available Wed-Fri): #89 (cross-team, low urgency)

    enforcement: >
      Recommendation FAIL if:
      ❌ Issues assigned with NO regard to related work (person gets random mix)
      ❌ Workload highly uneven (person X has 5 days, person Y has 0.5 days)
      ❌ Absence not accounted for (person assigned full week despite absence)
      ❌ No explanation for why work was assigned (should show: cohesion + capacity reasoning)

---

###############################################################################
# RISK ANALYSIS & BLOCKER DETECTION — Branch Coverage (CRITICAL)
###############################################################################
risk_analysis_branch_coverage:
  rule: >
    Risk analysis (slide ②, blockers, capacity, dependencies, estimates)
    MUST examine ALL team collection branches, not just develop.

    Analyzing only develop misses:
    - Work ready-to-merge but waiting (in Java-Development-Environment)
    - Blocked PRs on team branches (not on develop yet)
    - Capacity/staffing of team collection points
    - Dependencies between teams (visible on shared branches)

  team_collection_branches: >
    Known collection points that MUST be scanned:
    - develop (primary merge target)
    - Java-Development-Environment (Backend collection point)
    - [Ask team if other collection branches exist]

    Why: Developers merge feature→collection branch first.
         They may wait days/weeks before collection→develop.
         This visibility is critical for risk analysis.

  what_to_look_for_per_collection_branch:
    - "Open PRs waiting for review (blocking point)"
    - "Commits merged to collection branch but not develop yet (ready to ship?)"
    - "Who's working on what (capacity/staffing)"
    - "Dependencies between work items (one blocks another)"
    - "Estimated vs actual progress (burndown/velocity)"
    - "Team capacity (how many people, how many open issues)"

  enforcement: >
    Data acquisition: repository_branches_and_commits dataset MUST include
    all collection branches (not just develop).

    Risk analysis: When analyzing blockers/capacity/estimates,
    explicitly report which branches were scanned.
    Footer: "Scanned: develop, Java-Development-Environment | Last scan: [TIMESTAMP]"

  failure_condition: >
    ❌ FAIL if:
    - Only develop branch was analyzed (incomplete risk picture)
    - Team collection branches were not scanned
    - Report doesn't list which branches were examined

  example_correct_analysis: >
    ✅ develop: 5 open PRs, 2 merged this week
    ✅ Java-Development-Environment: 8 open PRs (waiting 3+ days), 15 commits this week
    → Risk: Backend queue is growing, may delay next develop merge
    → Action: Prioritize PR reviews on Java-Development-Environment branch

