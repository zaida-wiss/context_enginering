###############################################################################
# SYSTEM CONTRACT — Machine-readable presentation pipeline
###############################################################################

task: monday_meeting_presentation
version: 5.7
last_updated: 2026-09-21
base_path: "_ai_guides/presentations"

###############################################################################
# CORE PRINCIPLES
###############################################################################
core_principles:
  - "WCAG 2.2 AA is an absolute boundary. No layout or visual preference may weaken it."
  - "Project facts come from verified registered sources; unavailable facts remain explicitly unknown or incomplete."
  - "AI interpretation is clearly distinguished from verified source facts and confirmed team decisions."
  - "Cards adapt to content; content is never clipped to preserve a grid."
  - "Slide titles are fixed at 36 pt minimum and are never shrunk to solve layout pressure."
  - "Normal/card text starts at preferred larger sizes and is reduced only when required within defined ranges."
  - "Responsive typography uses the deliberate role-specific ranges defined by the readability and card authorities."
  - "If accessible/readability minimum sizes still do not fit, reduce card density or paginate."
  - "Required pedagogical/project-value microcopy is never removed to save space."
  - "Verified dependencies must influence planning order when they materially affect sequence."
  - "All source/provenance meaning is communicated with the canonical symbol + text defined by the provenance authority."
  - "The complete Monday deck preserves the official meeting-point order and cross-slide reasoning chains defined by the composition authority."
  - "Presentation defects are corrected in the owning context rule/validator first; a presentation-only patch is never the final fix."
  - "Required meeting text remains native/editable presentation text so it can be selected and copied into meeting notes; do not rasterize required textual content merely for visual fidelity."
  - "The user-facing deck contains only the cover plus official meeting points 1–14 and required continuation pages. Internal QA, audit, render-control and debug slides are forbidden in the delivered deck."
  - "Debug/control artifacts such as connector handles, node dots, construction lines and test annotations are forbidden in user-facing output."
  - "Refactoring, deduplication or removal of negative wording MUST preserve the underlying semantic invariant. A rule is not removed merely because a duplicated 'must not/never' sentence is deleted."
  - "Before deleting or weakening a prohibition, required field or omission guard, migrate its invariant to the owning authority and a regression check in the same change."
  - "Connectors are permitted only where the active meeting-point structure explicitly requires them; ordinary card slides must not contain free connector graphics."

###############################################################################
# EXECUTION / BRANCH SNAPSHOT
###############################################################################
repository_ref_policy:
  rule: >
    The ref used to read the entry README is authoritative for the entire
    execution. Every internal context-repository file MUST be read from the same
    branch/tag/SHA. Never silently switch to the default branch.
  missing_internal_file: "STOP — do not fetch the missing file from another branch."

execution_lifecycle:
  starts: "When the user requests a new presentation"
  execution_id_required: true
  snapshot_commit_sha_required: true
  ends_on: ["DELIVER", "STOP", "RESTART"]
  prior_execution_receipts_reusable: false

conflict_decision_gate:
  rule: >
    A genuine contradiction between active context authorities is a user-decision
    gate. The model must not resolve it autonomously.
  required_response:
    - "STOP the affected implementation/rendering path."
    - "Name the conflicting files and quote/summarize the conflicting requirements."
    - "Explain the practical consequence of each option."
    - "Ask the user for a decision."
    - "After the decision, update the owning context rule(s) and regression tests before continuing."
  forbidden:
    - "silently choose the higher-ranked rule"
    - "patch only the presentation artifact"
    - "reinterpret one rule until the conflict disappears"
    - "continue rendering with an unresolved contradiction"

###############################################################################
# AUTHORITY HIERARCHY
###############################################################################
authority:
  level_1_execution:
    file: "SYSTEM_CONTRACT.yaml"
    owns: "execution sequence, gates, STOP/CONTINUE, delivery rules"

  level_2_accessibility:
    file: "design/ACCESSIBILITY_NEURODIVERSITY.md"
    owns: "WCAG 2.2 AA, contrast, color redundancy, readability, NPF boundaries"
    absolute_rule: "No lower authority may weaken accessibility."

  level_3_global_visual:
    file: "design/VISUAL_DESIGN_MANDATORY.md"
    owns: "global theme, slide-title role, layout limits, card grid behavior"

  level_4_readability:
    file: "design/READABILITY_HARD_RULES.md"
    owns: "fixed 36 pt slide titles, larger text minima, block spacing, pedagogical microcopy, dependency-aware ordering"
    rule: "No lower authority may weaken these readability minima."

  level_5_card_component:
    file: "design/CARD_COMPONENT_STANDARD.md"
    owns: "card internals, metadata sizes, timestamps, owner/review/merge layout, spacing"

  level_6_provenance:
    file: "design/PROVENANCE_AND_AI_LABELING.md"
    owns: "schema facts vs team facts vs AI suggestions/analysis"

  level_7_pr_identity:
    file: "data/PR_MERGE_REVIEW_IDENTITY.md"
    owns: "actual merger and submitted approving-reviewer identity"

  level_8_overflow:
    file: "monday_meeting/design/LAYOUT_OVERFLOW_GUARD.md"
    owns: "mechanical fit, responsive density, pagination, collision prevention"

  level_9_composition:
    file: "monday_meeting/structure/COMPOSITION_ARCHITECTURE.md"
    owns: "meeting-point order, presence/empty states, cross-slide red threads and composition completeness"

  level_10_slide_content:
    file: "monday_meeting/design/SLIDE_DETAIL_SPEC.md"
    owns: "slide purpose, fields, ordering and content requirements"
    does_not_own: "visual constants, card internals, provenance semantics or deck-wide composition"

  reference_only:
    file: "monday_meeting/design/TEMPLATE_REFERENCE.html"
    owns: "nothing authoritative"

  verification:
    file: "verification/RENDER_GATE_CHECKLIST.md"
    owns: "pre-delivery validation"

  rendered_artifact_validator:
    file: "../../_audit/rendered_presentation_audit.py"
    owns: "mechanical PPTX/PDF artifact inspection for typography, geometry, overlap, card gaps, 3x2 structure, glyphs, selectable text, rendered background and contrast proxies"

  data_registry:
    project_resolved: "source_registry"
    resolve_via: "../../PROJECTS.yaml -> selected project manifest -> context.sources.path"
    owns: "registered sources, URLs/IDs, source classifications and fallback order"

  data_acquisition:
    file: "data/DATA_ACQUISITION_CONTRACT.yaml"
    owns: "mechanical acquisition algorithm, pagination and filtering"

###############################################################################
# CONTEXT BOOTSTRAP + TASK BUNDLE
###############################################################################
execution_receipt:
  required_before_build: true

  global_framework:
    file: "../AI_FRAMEWORK.yaml"
    normative: true
    required_before_presentation_authorities: true

  bootstrap:
    rule: >
      Start with the global AI framework, then the minimal presentation routing
      chain, reading each bootstrap file once from the execution ref.
    files:
      - "../AI_FRAMEWORK.yaml"
      - "MANDATORY_READING_ORDER.md"
      - "AUTHORITY_REGISTRY.yaml"
      - "INTEGRITY_CONSTRAINT.md"
      - "SYSTEM_CONTRACT.yaml"

  task_bundle:
    resolver: "AUTHORITY_REGISTRY.yaml"
    rule: >
      Resolve the requested presentation task, then load only the active
      authorities, validators and registered data dependencies required for that
      task. Record every loaded file and blob/commit identity in the execution
      receipt so the same bundle can be reproduced.
    progressive_loading: true
    duplicate_rule_loading: false

  source_routing:
    context_registry: "../../CONTEXT_REGISTRY.yaml"
    source_registry_ref: "selected project manifest -> context.sources.path"
    context_ingestion_ref: "registries.context_ingestion"

  missing_required_dependency:
    state: "INCOMPLETE"
    action: "Apply the relevant SYSTEM_CONTRACT gate before build."

###############################################################################
# ALLOWED SOURCES / TOOL ROUTING
###############################################################################
external_sources_policy:
  mode: "ALLOWLIST_ONLY"
  registry: "../../PROJECTS.yaml -> selected project manifest -> context.sources.path"
  rules:
    - "Use only registered project sources and their registered fallback chain."
    - "GitHub Connector/API is preferred for GitHub project data."
    - "Google Drive Connector is used only for registered Docs/Sheets sources."
    - "Generic web search is forbidden for project data."
    - "Shell network commands such as git clone/fetch, curl and wget are forbidden."
    - "If all registered fallbacks fail, mark the dataset INCOMPLETE; do not improvise a source."

###############################################################################
# DATA INTEGRITY AUTHORITY
###############################################################################
data_integrity_authority:
  file: "INTEGRITY_CONSTRAINT.md"
  owns: "verified-data semantics, explicit unknown/incomplete states and factual trust boundary"
  rule: >
    Apply INTEGRITY_CONSTRAINT.md for factual trust semantics. This system
    contract owns only the execution gates that act on those verification states.

###############################################################################
# PRESENTATION MODE / CAPACITY
###############################################################################
presentation_mode:
  default: "pre_meeting"

  pre_meeting:
    capacity: "optional"
    focus: "RISK-DRIVEN — show how risk analysis shaped THIS WEEK's decisions"
    purpose: "Meeting support and preparation for verified current project/course deliverables from the selected project context"
    rule: "Never estimate hours. Use verified documented constraints only."
    if_missing: "Use approved placeholder or omit capacity slide according to slide/content rules."
    risk_integration: >
      Point ⑦ Risks must show concrete trade-offs and mitigations implemented THIS WEEK.
      Point ⑫ Sprint Plan must validate realism against identified risks.
      Point ⑬ Next Steps must prioritize according to risk impact.
      Choose risks that demonstrate actual decision impact, not theoretical concern.

  post_meeting:
    capacity: "required"
    if_missing: "STOP"

sensitive_availability:
  rule: >
    Personal/health reasons are generalized to planning impact such as
    "limited availability". Do not expose sensitive reasons in the deck.
  inference_forbidden: "Do not infer percentage/hours/throughput impact unless source states it."

###############################################################################
# PROVENANCE AUTHORITY
###############################################################################
provenance_authority:
  file: "design/PROVENANCE_AND_AI_LABELING.md"
  owns: "source classes, canonical symbols, AI-analysis labels, AI-proposal labels and mixed-source labeling"
  rule: >
    Load and apply the provenance authority when presentation content mixes
    verified facts, team-confirmed information, analysis or proposals. This
    system contract references the authority and does not redefine its symbols.

###############################################################################
# ANALYSIS LAYER — INFORMATIVE, NOT FALSELY CONFIRMED
###############################################################################
analysis_and_recommendations:
  purpose: >
    The deck may help the team reason about priorities, dependencies, risks and
    next steps, but derived analysis must remain visibly distinct from source facts.

  may_include:
    - "AI priority suggestions based on verified dependencies"
    - "AI dependency interpretation grounded in issue/PR evidence"
    - "AI risk observations grounded in verified data"
    - "AI next-step suggestions"
    - "AI-suggested PL questions"

  must_not_do:
    - "Present an AI recommendation as an already-decided team action"
    - "Invent capacity or completion estimates"
    - "Invent deadlines, ownership or meeting purpose"
    - "State inferred consequences as source facts"

  estimates:
    rule: >
      Do not estimate completion time, hours or capacity unless the value is
      explicitly available in registered source data and the slide specification
      permits its use. Otherwise label qualitative AI analysis without numeric estimates.

###############################################################################
# RESPONSIVE VISUAL SYSTEM
###############################################################################
responsive_visual_system:
  absolute_accessibility: "WCAG 2.2 AA"
  readability_authority: "design/READABILITY_HARD_RULES.md"

  slide_title:
    preferred_pt: 36
    minimum_pt: 36
    shrink_for_fit: false

  card_style:
    surface: "dark glass-like card"
    team_accent: "narrow left accent; issue/PR numbers also use team color with a non-color ownership cue"
    full_team_outline: false
    content_driven_height: true

  typography:
    source_of_truth: "design/READABILITY_HARD_RULES.md + design/CARD_COMPONENT_STANDARD.md"
    automatic_shrink_to_fit: false
    rule: >
      Start normal/card text at preferred sizes; step down deliberately only when
      required and only within the role's allowed range. Never go below the
      readability/component minimums. Slide titles never shrink.

  card_content_flow:
    model: "parent card container with vertically stacked measured child containers"
    body_line_spacing: "1.15 standard and minimum"
    rules:
      - "measure wrapped text before placing the next child"
      - "derive each child top from the previous measured bottom plus required gap"
      - "resolve and measure all required bottom information rows before laying out upper content"
      - "reserve the complete measured bottom information zone, including row gaps, before body/title layout"
      - "body content may never consume, overlap or displace that reserved bottom zone"
      - "grow card, reduce density or paginate when measured content does not fit"
      - "fail rendering on any sibling bounding-box intersection"
    forbidden:
      - "fixed-height text containers that can clip or overlap wrapped text"
      - "independent absolute positioning for vertically stacked card text"
      - "reducing line spacing below 1.15 to solve fit"

  card_visual_priority:
    level_1: "issue title and assignee/person identity"
    level_2: "AI proposal, including proposed new issues"
    level_3: "merge/review, pedagogical explanation and AI analysis"
    level_4: "sources/provenance, branch, timestamp and technical/operational metadata"
    rule: >
      Level 1 receives the strongest focus and level 4 the least, using size,
      weight, spacing and WCAG-safe color together. Level 4 remains fully
      readable; priority never overrides WCAG or symbol preservation.

  per_slide_source_footer:
    required_on: "every physical slide, including continuation slides"
    content: "deduplicated sources actually used on that physical slide"
    verified_format: "canonical source symbol + short source name"
    unverifiable_expected_format: "⚠ + struck-through source name + text 'kunde inte verifieras'"
    priority_level: 4
    minimum_text_pt: 11
    rules:
      - "reserve measured footer height before laying out cards"
      - "footer supplements and never replaces card/block provenance"
      - "strikethrough is never the only unavailable-source cue"
      - "unverifiable sources are never described as used or verified"
      - "required-source failure still follows the applicable STOP rule"

  fit_order:
    - "keep slide title fixed at 36 pt or larger"
    - "start normal/card text at preferred sizes"
    - "natural wrapping"
    - "deliberate normal/card typography reduction only when required and within permitted range"
    - "preserve hard minimum block spacing"
    - "card grows/reflows"
    - "reduce grid density"
    - "continuation slide"

  forbidden:
    - "shrinking slide title below 36 pt"
    - "text clipping"
    - "text/card overlap"
    - "hidden required content"
    - "fonts below component/readability minimum"
    - "spacing below readability hard minimum"
    - "contrast below WCAG AA"
    - "color-only meaning"
    - "automatic shrink-to-fit"
    - "removing provenance labels to save space"
    - "removing pedagogical/project-value microcopy to save space"
    - "including internal QA/audit/render-control slides in the user-facing deck"
    - "leaving debug/control markers, connector handles or construction graphics visible"
    - "using connector arrows on ordinary card slides that do not own a connector-based structure"

###############################################################################
# EXECUTION SEQUENCE
###############################################################################
execution_sequence:
  step_1:
    name: "Read all mandatory files"
    output: "execution receipt with file/blob SHA and execution_ref"

  step_2:
    name: "Instruction audit"
    must_confirm:
      - "WCAG 2.2 AA is absolute"
      - "slide title fixed at 36 pt minimum and never shrunk for fit"
      - "readability hard rules loaded"
      - "normal/card text starts at preferred size and is reduced only when required"
      - "responsive card typography ranges loaded"
      - "pedagogical microcopy requirement loaded"
      - "dependency-aware planning rule loaded"
      - "provenance rules loaded"
      - "template is reference only"
      - "same repository ref used for all internal files"
      - "authority conflicts recorded with both rules, owners and resolution"
      - "cover uses verified current-week PL focus and deadlines"
      - "every applicable course/project task answers the required task-information dimensions from the selected project's registered context/data sources"
      - "meeting point 1 uses six cards as standard capacity per physical slide and has no total slide/card limit"
      - "meeting point 1 always renders the registered primary integration branch, every registered collection branch in project-defined order, and Teamsammanfattning, including verified empty/incomplete branch pages"
      - "cover sprint period is the active interval resolved from the selected project's registered sprint cadence using the request timestamp"
      - "meeting point 1 contains only verified work from active sprint start through the actual data cutoff"
      - "the deck is always an in-progress planning document for the active sprint"
      - "points 3–5 and 9 plan the remaining horizon from data cutoff to active sprint end"
      - "the final meeting-point-1 teamsammanfattning subsection uses 1–10 sentences per registered team, names every registered team member and grounds each contribution/decision"
      - "meeting point 2 is a chronological course/project timeline with a current-week marker and contains no blockers, dependencies or risks"
      - "the visible sprint interval uses the complete registered sprint boundaries and never shifts its start to the meeting date"
      - "points 3–5 are team slots populated from the registered team roster/order and own backlog, future work, older inactive work and decisions that govern upcoming team work"
      - "meeting point 9 content structure is supplied by SLIDE_DETAIL_SPEC.md"
      - "meeting point 9 visual fit and continuation behavior are supplied by the registered design/overflow authorities"
      - "points 3–5 → 9 → 13 form a progressive funnel: team work state → project-wide priority → concise executable actions"
      - "canonical source symbols are preserved and not replaced by tags"
      - "required meeting text is native/selectable/copyable text in the presentation artifact, not flattened into images or vector paths"

  sprint_period_resolution:
    cadence_authority: "../../PROJECTS.yaml -> selected project manifest -> context.sprint_cadence.path"
    rule: >
      Resolve the active sprint from the request timestamp using the selected
      project's registered sprint cadence, not from the target meeting label.
      The cover displays the complete registered start/end boundaries of the
      active sprint containing the request timestamp. Meeting point 1 includes
      verified work from sprint start through the actual acquisition cutoff; it
      never claims future work between cutoff and sprint end.
    boundary_rule: >
      Apply the selected project's registered timezone, start day/time,
      duration and interval-boundary semantics exactly.
    forward_use_rule: >
      Regardless of request day/time, the presentation is an in-progress working
      document for the resolved active sprint. Verified facts cover sprint start
      through data cutoff; forward sections cover remaining work through sprint
      end using verified plans or explicit AI labels.

  cover_school_task_contract:
    required_questions: ["Vad", "När", "Var", "Varför", "Hur"]
    scope: "all school tasks/deadlines and PL topics in or materially affecting the current week"
    source_boundary: "selected project manifest -> registered course/project context and presentation data sources"
    rules:
      - "all five answers are visible on the cover or its ⓪a continuation"
      - "each verified answer retains source provenance"
      - "documented meaning/consequence is shown under Varför"
      - "documented submission/meeting/execution method is shown under Hur"
      - "missing answers remain visible as ⚠ [FIELD] kunde inte verifieras"
      - "AI analysis never fills a verified-answer field"

  step_3:
    name: "Data precheck"
    rule: "Validate registered mandatory inputs before expensive data acquisition."

  step_4:
    name: "Data acquisition"
    rule: "Use registered sources/fallbacks only."

  step_5:
    name: "Data audit"
    rule: >-
      Verify completeness/checksums. If any REQUIRED or CRITICAL dataset remains
      incomplete after registered fallbacks, PAUSE and ask the user whether to
      continue without the named source.

  incomplete_source_override:
    default_action: "PAUSE — do not compose or render"
    prompt_must_name:
      - "incomplete dataset"
      - "missing source"
      - "all attempted fallbacks and failure reasons"
      - "slides, claims and analyses affected"
    continue_requires: "explicit user approval"
    approved_status: "PASS_WITH_USER_OVERRIDE"
    approval_rules:
      - "record the user's decision in the acquisition receipt"
      - "omit claims and analyses that depend on the missing source"
      - "show the missing source and affected limitation with ⚠ in the relevant footer/content"
      - "never reinterpret INCOMPLETE as verified empty data"
    refusal_or_no_response: "STOP"

  step_6:
    name: "Compose slide content"
    rule: >
      Follow SLIDE_DETAIL_SPEC for fields/purpose and provenance authority for
      source identity. Required next-step microcopy and dependency-aware ordering
      must be preserved. Do not invent missing content.

  step_7:
    name: "Build internal presentation"
    prerequisite: "build_gate PASS"

  step_8:
    name: "Render + inspect"
    rule: >
      Use RENDER_GATE_CHECKLIST on the actual artifact and run the executable
      rendered-artifact validator. For PPTX authored internally and PDF delivered
      externally, validate both artifacts together when both exist.
    command_examples:
      - "python _audit/rendered_presentation_audit.py deck.pptx --pdf deck.pdf --project <selected_project_id>"
      - "python _audit/rendered_presentation_audit.py deck.pdf --project <selected_project_id>"
    required_result: "rendered_artifact_audit PASS"

  step_9:
    name: "Deliver"
    prerequisite: "delivery_gate PASS"

post_delivery_feedback:
  default_target: "context repository"
  rule: >
    After a presentation has been delivered, treat discussion, critique and
    requested improvements as proposed changes to the context repository by
    default. Improve the owning active authority so future presentations produce
    the intended result consistently.
  artifact_mutation_gate:
    presentation_update_requires: "an explicit user request to update, revise, regenerate or replace the presentation artifact"
    discussion_alone_authorizes_presentation_update: false
    context_improvement_request_authorizes_presentation_update: false
  clarification_rule: >
    If it is genuinely ambiguous whether the user wants the artifact changed,
    do not modify it. Continue reasoning and update only the context repository,
    or ask one focused clarification question when the target cannot be inferred.
  preservation_rule: >
    Never silently regenerate an existing PPTX, PDF or Slides artifact while
    implementing feedback in the context repository.
  requested_change_conflict_protocol:
    trigger: >
      A new user preference or requested context change contradicts, weakens or
      cannot coexist with an earlier active rule.
    required_response:
      - "Identify the existing rule and its active authority file."
      - "State the new requested rule."
      - "Explain the practical consequence of choosing each rule."
      - "Ask the user which rule is more important."
    mutation_gate: >
      Do not overwrite, retire or reinterpret either conflicting rule until the
      user has selected the priority. Non-conflicting requested changes may
      continue independently.
    wcag_exception:
      priority: "absolute and non-negotiable"
      rule: >
        WCAG 2.2 AA and the active accessibility/readability hard limits may
        never be selected against, weakened or deprioritized. If a request
        conflicts with them, explain the exact conflict and propose the closest
        accessible alternative. Do not ask whether WCAG should lose priority.
    prohibited_behavior:
      - "silent last-request-wins resolution"
      - "guessing priority from wording or recency"
      - "changing the presentation artifact while waiting for the decision"
      - "offering WCAG compliance as an optional trade-off"
  collaborative_conflict_audit:
    trigger: >
      The user asks to search for contradictions, overlaps or ambiguous rules in
      the context repository or code.
    phase_1_read_only_discovery:
      - "Search active authorities and relevant validators before retired material."
      - "Group findings by rule category and identify the owning files."
      - "For each finding, quote or accurately summarize both conflicting rules."
      - "Explain practical consequences and indicate whether WCAG fixes the priority automatically."
      - "Do not edit, delete, retire or merge conflicting rules during discovery."
    phase_2_chat_decision:
      rule: >
        Discuss unresolved conflicts with the user in chat. Ask which outcome is
        most important, preferably one conflict or a small related group at a
        time. Record the selected canonical rule and its owner.
    phase_3_cleanup:
      prerequisite: "explicit user decision or an automatic WCAG requirement"
      actions:
        - "Update the canonical active authority."
        - "Remove, retire or redirect the conflicting duplicate as agreed."
        - "Update validators when the selected rule can be checked automatically."
        - "Run authority audit and diff validation."
      presentation_artifact_rule: >
        Conflict cleanup changes the context repository only unless the user
        separately and explicitly requests a presentation update.

###############################################################################
# ARTIFACT GATES
###############################################################################
artifact_gates:
  build_gate:
    requires:
      - "execution_receipt PASS"
      - "instruction_audit PASS"
      - "data_precheck PASS"
      - "data_acquisition_receipt PASS or PASS_WITH_USER_OVERRIDE"
      - "data_audit PASS or PASS_WITH_USER_OVERRIDE"
    failure_action: >-
      PAUSE and ask whether to continue without each named missing REQUIRED or
      CRITICAL source. STOP unless the user explicitly approves degraded mode.

  delivery_gate:
    requires:
      - "build_gate PASS"
      - "render_gate PASS"
      - "rendered_artifact_audit PASS"
      - "WCAG_2_2_AA PASS"
      - "READABILITY_HARD_RULES PASS"
      - "PROVENANCE_AND_AI_LABELING PASS"
      - "OVERFLOW_AND_COLLISION PASS"
      - "DEPENDENCY_AWARE_PLAN PASS"
    default_format: "PDF"
    default_delivery_rule: >
      Deliver the finished presentation to the user as PDF only by default.
      Do not substitute PPTX, Google Slides or another presentation format and
      do not include an editable copy unless the user explicitly asks for one.
    explicit_override_rule: >
      If the user explicitly requests another format, deliver that requested
      format. If the user asks for both PDF and an editable format, deliver both.
    editable_format: "PPTX only when explicitly requested"
    pdf_generation_rule: >
      The internal deck may be authored in PPTX or another supported format for
      production, but the user-facing artifact remains PDF unless explicitly overridden.

###############################################################################
# FINAL RENDER CONDITIONS
###############################################################################
render_acceptance:
  executable_validator:
    path: "../../_audit/rendered_presentation_audit.py"
    rule: >
      Delivery requires a zero-failure result from the executable validator on
      the actual user-facing artifact. When both PPTX and PDF exist, validate both
      so source-structure defects and export/render defects are both detectable.
    pdf_dependency: "../../_audit/requirements-rendered-presentation.txt"
  zero_count_requirements:
    wcag_aa_violation_count: 0
    color_only_information_count: 0
    text_overlap_count: 0
    card_overlap_count: 0
    text_outside_card_count: 0
    text_clipping_count: 0
    out_of_bounds_element_count: 0
    font_below_component_minimum_count: 0
    slide_title_below_36pt_count: 0
    slide_title_shrunk_for_fit_count: 0
    body_text_below_role_minimum_count: 0
    card_block_spacing_violation_count: 0
    next_step_card_missing_project_value_microcopy_count: 0
    verified_dependency_not_reflected_in_plan_count: 0
    dependency_order_missing_when_evidence_exists_count: 0
    missing_required_card_row_count: 0
    uneven_row_spacing_caused_by_vertical_justification: 0
    full_team_outline_count: 0
    ai_analysis_without_magnifying_glass_count: 0
