###############################################################################
# MAINTENANCE / CONFLICT PREVENTION
###############################################################################
maintenance:
  rule: >
    Do not create competing _V2/_OLD/_UPDATED policy files. Update the owning
    authority directly and rely on git history for previous versions.

  authority_ownership:
    rule: >
      This order identifies rule ownership and delegation only. It must never be
      used to silently choose between incompatible active requirements.
    order:
      - "SYSTEM_CONTRACT for orchestration"
      - "ACCESSIBILITY for WCAG boundary"
      - "VISUAL_DESIGN for global visual rules"
      - "READABILITY_HARD_RULES for fixed title size, text minima, spacing, microcopy and dependency-aware order"
      - "CARD_COMPONENT for card internals"
      - "PROVENANCE for fact/team/AI identity"
      - "OVERFLOW_GUARD for fit/pagination"
      - "COMPOSITION_ARCHITECTURE for deck-wide composition"
      - "SLIDE_DETAIL_SPEC for content"
      - "TEMPLATE_REFERENCE never wins"
    genuine_active_conflict: >
      STOP the affected path, surface both conflicting requirements and their
      consequences, ask the user for an explicit decision, then update the owning
      rule(s) and regression protection before continuing.
    registry: "AUTHORITY_REGISTRY.yaml is the canonical file-status and ownership registry"
    retired_files: "Never load or merge rules from files listed under retired_guides"

###############################################################################
# END
