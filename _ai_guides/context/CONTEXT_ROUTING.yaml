# CONTEXT INGESTION & ROUTING

**Purpose:** When user provides project information (schedule, deadlines, goals, decisions),
route it automatically to the correct canonical context file in the repo.

---

## CLASSIFICATION LAYER

### Step 1: Identify Information Type

When user provides information, classify as ONE of:
- **schedule** — meeting times, recurring events, calendar
- **deadline** — due date, submission, milestone
- **milestone** — phase, release, checkpoint
- **sprint_goal** — this week's focus, weekly objective
- **roadmap** — long-term phases, project timeline
- **team_roster** — people, roles, responsibilities
- **decision** — approved decision, policy, technical choice
- **unknown** — cannot classify (ask for clarification)

### Step 2: Extract Structured Fields

For all classified information:
- title
- date (convert to ISO 8601: YYYY-MM-DD)
- time (if applicable, convert to HH:MM)
- timezone (default: Europe/Stockholm)
- owner / responsible person
- team / affected scope
- source (user_provided, course_schedule, github_issue, email, etc)
- confidence (high/medium/low)

### Step 3: Route to Canonical File

---

## ROUTING TABLE

| Classification | Triggers | Canonical File | Action |
|---|---|---|---|
| **schedule** | meeting, time, recurring weekday, calendar, team sync, huddle | `_memory/presentations/SCHEDULE.yaml` | merge with existing schedule |
| **deadline** | deadline, due date, release, demo, submission, deployment | `_memory/presentations/MILESTONES.yaml` | add as milestone |
| **milestone** | phase, week range, project timeline, long-term plan | `_memory/presentations/TEAM_ROADMAP.yaml` | update phase dates |
| **sprint_goal** | this week, sprint goal, weekly goal, current focus, priority | `_memory/presentations/CURRENT_SPRINT.yaml` | update sprint_focus array |
| **roadmap** | phases, weeks, project structure, long-term plan | `_memory/presentations/TEAM_ROADMAP.yaml` | update phases |
| **team_roster** | person, role, team assignment, responsibility | `_memory/TEAM_ROSTER.md` | add/update member info |
| **decision** | approved, decided, rule, policy, "we will", "from now on" | `docs/BESLUT.md` | add to decision log |

### Routing Examples

```
User: "Tisdagar 12:30 PL-möte"
→ Classification: schedule
→ Route to: _memory/presentations/SCHEDULE.yaml
→ Action: merge into recurring_meetings.tuesday

User: "CTO-underlag måste vara klart 24 september"
→ Classification: deadline + milestone
→ Route to: _memory/presentations/MILESTONES.yaml
→ Route to: _memory/presentations/TEAM_ROADMAP.yaml
→ Action: add deadline, mark V6 as critical

User: "Vi fokuserar på kärnflöde denna vecka"
→ Classification: sprint_goal
→ Route to: _memory/presentations/CURRENT_SPRINT.yaml
→ Action: update sprint_focus array

User: "Vi använder Vitest för testing framework"
→ Classification: decision
→ Route to: docs/BESLUT.md
→ Action: log decision with date, impact
```

