# Context ingestion router

This router delegates exact file-level placement and the user-visible pre-write
receipt to `CONTEXT_PLACEMENT_CONTRACT.yaml`.

## Purpose

This file defines **how new project information is classified and routed**.

It does not own repository paths. Canonical paths and task bundles are resolved
through `CONTEXT_REGISTRY.yaml`.

It does not own presentation rules. Presentation behavior is defined by the
registered presentation authorities.

## Routing flow

```text
new information
  ↓
split mixed input into atomic information units
  ↓
classify scope + semantic type
  ↓
extract structured fields
  ↓
resolve logical destination through CONTEXT_REGISTRY
  ↓
resolve exact canonical owner + exact file through CONTEXT_PLACEMENT_CONTRACT
  ↓
compare with existing canonical context
  ↓
emit placement receipt to user
  ↓
write / merge OR ask focused control question
  ↓
record source + update time + propagation
```

## Information classes

Use the smallest fitting class:

- `schedule` — meetings, recurring times, calendar events
- `deadline` — due dates, submissions, release dates
- `milestone` — project/course checkpoints and phase boundaries
- `sprint_goal` — current sprint/week focus
- `roadmap` — longer-term phases and sequence
- `team_roster` — people, roles and team membership
- `decision` — confirmed project/process/technical decisions
- `manual_source` — source material supplied manually because no live registered source exists
- `unknown` — classification needs clarification
- `rule` — durable behavior/instruction that changes how a system works
- `constraint` — durable boundary such as unavailable project time or ownership restriction
- `presentation_behavior` — project/global presentation composition or rendering behavior
- `design_identity` — colors, symbols or project visual identity
- `source_evidence` — externally or manually supplied evidence that may support facts
- `current_state` — changing repository/project status that normally stays live rather than long-lived context

## Structured fields

Capture the fields that are actually available:

```yaml
title:
date:
time:
timezone:
owner:
team:
source:
source_type:
confidence:
updated_at:
```

Use `Europe/Stockholm` when a timezone is required and the source belongs to
the team's normal Swedish schedule context.

Missing fields remain unset until they are known.

## Logical destinations

Resolve paths through `CONTEXT_REGISTRY.yaml`.

Canonical logical routing is project-aware:

```yaml
schedule: selected_project.manifest -> context.course.schedule.path
deadline: selected_project.manifest -> context.course.deadlines.path
milestone: selected_project.manifest -> context.course.milestones.path
sprint_goal: selected_project.manifest -> context.sprint_cadence.path or a narrower registered project planning path
roadmap: selected_project.manifest -> context.course.roadmap.path
team_roster: selected_project.team_roster
decision: selected_project.manifest -> narrowest registered project decision domain when project-specific
global_decision: decisions.confirmed
manual_source: selected_project.source_registry or the narrowest registered project-owned source/material domain
```

Project-owned facts MUST NOT be routed into the global `memory` or `data` domains
merely because an older logical shorthand exists. Resolve the selected project
first, then use only capabilities declared by its manifest. If the needed
project-owned category is not declared, propose/register the narrowest reusable
project capability instead of silently falling back to a global dumping ground.

The registry maps stable global destinations and selected-project resolvers.

Exact file placement is resolved by `CONTEXT_PLACEMENT_CONTRACT.yaml`.
Do not write based only on a broad category match.

## Conflict handling

Compare incoming information with the current canonical value.

Use one of these states:

```yaml
same:
  action: keep existing canonical value and record matching source when useful

compatible_update:
  action: merge the new verified information

conflict:
  action: show the user the competing values, their sources and practical effect
  resolution: user decision or higher-authority source

unknown:
  action: ask one focused clarification question when the missing fact blocks routing
```

When a conflict affects presentation rules, first identify the owning authority
through the presentation authority registry before proposing a change.

When destination itself is ambiguous, use the placement contract's clarification
gate. Name the candidate destinations and explain the practical consequence of
each before asking the user.

## Source handling

Every stored project fact keeps a source identity.

Preferred order for living information:

1. live registered source
2. stable repository knowledge
3. manual source material with source note
4. explicit snapshot when a point-in-time capture is required
5. derived data with reproducible input references

Manual source material belongs in the data domain rather than being copied into
presentation instruction files.

## Update propagation

After a canonical context value changes:

0. confirm the placement receipt matches the actual file(s) to be written
1. update the owning data/memory/decision location
2. update dependent indexes or registries when the path or dependency changed
3. leave presentation rules unchanged unless the user requested a rule change
4. run path/link validation when a file moved
5. let future presentation tasks read the new canonical value through their task bundle

## Model-neutral instruction style

Instructions describe the task goal, canonical owner and expected result.

The system guides the model toward the desired output by:
- identifying the correct authority
- supplying verified context
- resolving only the dependencies needed for the task
- validating the result against explicit acceptance checks

This keeps the repository usable across different AI models without asking a
model to replace its own operating instructions.

