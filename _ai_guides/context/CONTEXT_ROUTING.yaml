## CONFLICT DETECTION

When information conflicts with existing context:

### Scenario 1: Time Conflict

**Existing:** `Tuesday 12:30-14:00 PL meeting`
**Incoming:** `Tuesday 13:00 PL meeting`

**Action:**
```yaml
conflict_detected:
  type: "time_overlap"
  existing: "12:30-14:00"
  incoming: "13:00"
  resolution: "requires_user_confirmation"
  action: "flag and ask user which is correct"
```

### Scenario 2: Date Conflict

**Existing:** `Deadline 2026-09-24 (from course schedule)`
**Incoming:** `Deadline 2026-09-23 (from Canvas)`

**Action:**
```yaml
conflict_detected:
  type: "date_mismatch"
  existing: "2026-09-24 (source: course_schedule)"
  incoming: "2026-09-23 (source: user_provided)"
  resolution: "flag and ask which source is authoritative"
```

### Scenario 3: Duplicate Entry

**Existing:** `CTO-underlag · 2026-09-24 · 16:00`
**Incoming:** `CTO-underlag · 2026-09-24 · 16:00` (identical)

**Action:**
```yaml
conflict_detected:
  type: "exact_duplicate"
  resolution: "skip (already exists)"
  action: "do not re-add, acknowledge"
```

---

## MERGE & PRESERVATION RULES

1. **Never overwrite without verification** — if conflict detected, ask user
2. **Preserve existing information** — keep earlier entries unless explicitly replaced
3. **Record all sources** — every entry must show where it came from
4. **Timestamp all updates** — when was this added/modified
5. **No invented information** — never guess missing dates, times, or details

---

## INGESTION PROCESS (Full Flow)

```
USER PROVIDES INFORMATION
        ↓
1. IDENTIFY TYPE
   (schedule / deadline / milestone / sprint / decision / unknown)
        ↓
2. EXTRACT FIELDS
   (title, date, owner, team, source, confidence)
        ↓
3. DETECT CONFLICTS
   (exact match / time conflict / date conflict / unknown)
        ↓
4. ROUTE TO FILE
   (_memory/presentations/ or docs/)
        ↓
5. MERGE
   (add / replace / flag for confirmation)
        ↓
6. RECORD SOURCE & TIMESTAMP
        ↓
7. UPDATE DEPENDENT CONTEXT
   (if framsida weekly_focus changed, update presentation)
```

---

## SPECIAL RULES

### Rule: Do Not Invent Missing Information

❌ **WRONG:**
```
User: "Demo is Thursday"
Inferred: "Must be 09:00 (usual demo time)"
Action: Add "2026-09-19 09:00 Demo"
```

✅ **CORRECT:**
```
User: "Demo is Thursday"
Extracted: {date: "2026-09-19", time: null}
Action: Add "2026-09-19 Demo (time TBD)"
```

### Rule: Update Dependent Context

If `CURRENT_SPRINT.yaml` sprint_focus changes → update framsida `weekly_focus`
If `MILESTONES.yaml` next deadline changes → update framsida footer

