---
name: sprint_cadence
description: Canonical sprint-boundary rules for the Avanza project
metadata:
  type: project_data
  project: avanza
  status: active
  timezone: Europe/Stockholm

cadence:
  duration_days: 7
  start_day: monday
  start_time: "09:00"
  timezone: Europe/Stockholm
  end_rule: next_sprint_start
  interval_semantics: "[start, end)"

completion_window:
  rule: >
    "Completed this sprint" contains only work whose verified completion timestamp
    is inside the active sprint interval from sprint start inclusive to the
    current verified data cutoff. At a new sprint boundary this dataset starts
    empty and fills only with work completed in the new sprint.
  boundary_behavior: >
    Every Monday at 09:00 Europe/Stockholm, the completed-work window switches
    immediately to the new active sprint. Meeting point 1 is empty at the boundary
    unless completion evidence exists at or after that exact timestamp. Work from
    the sprint that ended at 09:00 remains historical evidence and must not be
    carried into the new meeting-point-1 result.
  reset_at_each_sprint_start: true
  carry_previous_sprint_completed_work_into_current: false

continuity:
  rule: >
    Current-state information is not reset merely because a new sprint starts.
    Open work, blockers, risks, dependencies and other still-current facts remain
    eligible when verified as current.
  carry_current_open_state_across_boundary: true

planning_availability:
  project_work_days:
    - monday
    - tuesday
    - wednesday
    - thursday
  non_project_days:
    - friday
    - saturday
    - sunday
  available_project_days_per_sprint: 4
  hard_rule: >
    Sprint planning, workload distribution, capacity reasoning and planning
    proposals must never count Friday, Saturday or Sunday as available project
    work time. Project work is planned only Monday through Thursday.
  numeric_capacity_rule: >
    Four eligible project-work days does not imply any fixed number of hours.
    Never infer hours per day, percentage availability, velocity or individual
    capacity. Use verified availability, absence, meetings and estimates from
    registered sources; otherwise keep numeric capacity unknown.
