description: Canonical hard project-working-time constraints for the Avanza project
version: 1.0
metadata:
  type: project_constraint
  project: avanza
  status: active
  timezone: Europe/Stockholm
  source: "projects/avanza/course/TEAM_SCHEDULE.yaml"
