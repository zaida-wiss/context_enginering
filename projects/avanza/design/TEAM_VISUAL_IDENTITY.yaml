---
name: team_visual_identity
description: Canonical Avanza team labels and visual identity used in project-facing artifacts
version: 1.2
metadata:
  type: project_design_config
  project: avanza
  status: active

teams:
  frontend:
    display_name: "Frontend"
    short_name: "FE"
    color: "#2DD4BF"
    symbol: "🖥"
  backend:
    display_name: "Backend"
    short_name: "BE"
    color: "#FF4FA3"
    symbol: "🗄"
  native:
    display_name: "Native/System"
    short_name: "Native"
    color: "#A855F7"
    symbol: "⚙"
  cross_team:
    display_name: "Cross-team"
    short_name: "Cross"
    color: "#F59E0B"
    symbol: "🔗"

criticality:
  critical:
    display_name: "Kritiskt"
    color: "#EF4444"
    symbol: "●"
    meaning: "riskerar deadline, scope, demo eller blockerar annat team"
  important:
    display_name: "Viktigt"
    color: "#F59E0B"
    symbol: "●"
    meaning: "påverkar plan/prioritet men stoppar inte allt direkt"
  stable:
    display_name: "Stabilt"
    color: "#22C55E"
    symbol: "●"
    meaning: "klar/låg risk eller normal uppföljning"

neutral:
  color: "#94A3B8"

usage:
  rule: >
    Use these project-specific identities only after the Avanza project has been
    selected. Generic presentation authorities must not hardcode these team
    names or colors.
  accessibility: >
    Color is supplementary. Mixed-team views require a non-color identity cue
    resolved from this configuration. Criticality must always use symbol + text +
    color together, never color alone.
  meeting_cards: >
    Team color marks ownership/area and the registered team symbol supplies the
    non-color cue. On dedicated team slides, do not repeat the team name inside
    each card because the slide header already provides that text context. On
    mixed-team slides, use team accent + team symbol and one compact legend for
    the slide rather than repeating full team names inside every card. Criticality
    color marks urgency/risk and always appears as symbol + text + color inside
    the card.
  symbol_persistence: >
    Registered team symbols are semantic UI, not decoration. They must survive
    generation, simplification and PDF export. Missing or substituted symbols are
    render failures.

---
status: ACTIVE
