---
name: external_sources_registry
description: Machine-readable registry of all external data sources, URLs, IDs, access methods, and classifications
version: 1.0
metadata:
  type: registry
  critical: true
  role: "Single source of truth for external source definitions"
  note: "This file OWNS all URLs, IDs, access_methods, and classifications. Do NOT duplicate in other files — reference source IDs instead."

---

sources:

  # REQUIRED GITHUB SOURCES

  GITHUB_MERGED_PRS:
    source_id: "GITHUB_MERGED_PRS"
    classification: "REQUIRED"
    purpose: "Merged PRs to develop branch within reporting period"

    # PRIMARY SOURCE: GitHub REST API (structured, deterministic, best for filtering)
    primary:
      source_type: "github_rest_api"
      url: "https://api.github.com/repos/chas-challenge-2026/avanza-team1/pulls?state=closed&base=develop&per_page=100"
      http_method: "GET"
      note: "Canonical endpoint; implementation order defined below"

    implementation_order:
      - "github_connector"
      - "http_fetch"
      - "web_fetch"

    selection_rule: "If github_connector available, MUST be attempted first before other implementations"

    allowed_implementations:
      - "github_connector"
      - "http_fetch"
      - "web_fetch"

    forbidden_access_methods:
      - "web_search"
      - "general_web_access"
      - "raw_github (raw.githubusercontent.com)"
      - "csv_export"

    # FALLBACK SOURCES (tried in order if primary source unreachable)
    fallbacks:
      - fallback_order: 1
        source_id: "GOOGLE_PROJECT_DATA_SHEET"
        source_type: "google_sheets_structured_data"
        note: "Try only if GitHub API completely unavailable (DNS, auth, rate limit)"
        freshness_requirement: "last_synced_at >= REPORTING_PERIOD_END (must verify before use)"

      - fallback_order: 2
        source_id: "GITHUB_MERGED_PRS_WEB"
        source_type: "github_web_ui"
        url: "https://github.com/chas-challenge-2026/avanza-team1/pulls?q=is%3Apr+is%3Amerged"
        note: "Last resort: requires HTML parsing; less reliable than API"

  GITHUB_OPEN_ISSUES:
    source_id: "GITHUB_OPEN_ISSUES"
    classification: "REQUIRED"
    purpose: "Open issues with assigned owner within reporting period"

    # PRIMARY SOURCE: GitHub REST API (structured, deterministic, best for filtering)
    primary:
      source_type: "github_rest_api"
      url: "https://api.github.com/repos/chas-challenge-2026/avanza-team1/issues?state=open&per_page=100"
      http_method: "GET"
      note: "Canonical endpoint; API includes PRs so contract must filter pull_request key; implementation order defined below"

    implementation_order:
      - "github_connector"
      - "http_fetch"
      - "web_fetch"

    selection_rule: "If github_connector available, MUST be attempted first before other implementations"

    allowed_implementations:
      - "github_connector"
      - "http_fetch"
      - "web_fetch"

    forbidden_access_methods:
      - "web_search"
      - "general_web_access"
      - "raw_github (raw.githubusercontent.com)"
      - "csv_export"

    # FALLBACK SOURCES (tried in order if primary source unreachable)
    fallbacks:
      - fallback_order: 1
        source_id: "GOOGLE_PROJECT_DATA_SHEET"
        source_type: "google_sheets_structured_data"
        note: "Try only if GitHub API completely unavailable"
        freshness_requirement: "last_synced_at >= REPORTING_PERIOD_END (must verify before use)"

      - fallback_order: 2
        source_id: "GITHUB_OPEN_ISSUES_WEB"
        source_type: "github_web_ui"
        url: "https://github.com/chas-challenge-2026/avanza-team1/issues?q=is:open"
        note: "Last resort: requires HTML parsing; less reliable than API"

  GITHUB_OPEN_PRS:
    source_id: "GITHUB_OPEN_PRS"
    classification: "REQUIRED"
    purpose: "Open pull requests with review status and branch information"

    primary:
      source_type: "github_rest_api"
      url: "https://api.github.com/repos/chas-challenge-2026/avanza-team1/pulls?state=open&per_page=100"
      http_method: "GET"
      note: "Separate from issues API; provides PR-specific fields (head.ref, requested_reviewers, review_state); implementation order defined below"

    implementation_order:
      - "github_connector"
      - "http_fetch"
      - "web_fetch"

    selection_rule: "If github_connector available, MUST be attempted first before other implementations"

    allowed_implementations:
      - "github_connector"
      - "http_fetch"
      - "web_fetch"

    forbidden_access_methods:
      - "web_search"
      - "general_web_access"
      - "raw_github (raw.githubusercontent.com)"

    fallbacks:
      - fallback_order: 1
        source_id: "GOOGLE_PROJECT_DATA_SHEET"
        source_type: "google_sheets_structured_data"
        note: "Try only if GitHub API completely unavailable"
        freshness_requirement: "last_synced_at >= REPORTING_PERIOD_END (must verify before use)"

      - fallback_order: 2
        source_id: "GITHUB_OPEN_PRS_WEB"
        source_type: "github_web_ui"
        url: "https://github.com/chas-challenge-2026/avanza-team1/pulls?q=is:open"
        note: "Last resort: requires HTML parsing; less reliable than API"

  GITHUB_BRANCHES:
    source_id: "GITHUB_BRANCHES"
    classification: "REQUIRED"
    purpose: "List all repository branches including collection branches (Java-Development-Environment, C/C++-Native)"

    primary:
      source_type: "github_rest_api"
      url: "https://api.github.com/repos/chas-challenge-2026/avanza-team1/branches?per_page=100"
      http_method: "GET"
      note: "Lists all branches; used to detect collection branches and activity; implementation order defined below"

    implementation_order:
      - "github_connector"
      - "http_fetch"
      - "web_fetch"

    selection_rule: "If github_connector available, MUST be attempted first before other implementations"

    allowed_implementations:
      - "github_connector"
      - "http_fetch"
      - "web_fetch"

    forbidden_access_methods:
      - "web_search"
      - "general_web_access"

    fallbacks: []

  GITHUB_COMMITS:
    source_id: "GITHUB_COMMITS"
    classification: "REQUIRED"
    purpose: "Commits per branch during reporting period (activity tracking)"

    primary:
      source_type: "github_rest_api"
      url: "https://api.github.com/repos/chas-challenge-2026/avanza-team1/commits?sha={branch}&since={REPORTING_PERIOD_START}&until={REPORTING_PERIOD_END}&per_page=100"
      http_method: "GET"
      note: "Parameterized by branch and reporting period; shows activity per branch; implementation order defined below"

    implementation_order:
      - "github_connector"
      - "http_fetch"
      - "web_fetch"

    selection_rule: "If github_connector available, MUST be attempted first before other implementations"

    allowed_implementations:
      - "github_connector"
      - "http_fetch"
      - "web_fetch"

    forbidden_access_methods:
      - "web_search"
      - "general_web_access"

    fallbacks: []

  GITHUB_TEAM_ROSTER:
    source_id: "GITHUB_TEAM_ROSTER"
    classification: "REQUIRED"
    purpose: "Team member identity verification (7 members)"
    primary:
      method: "local_file"
      path: "_memory/TEAM_ROSTER.md"
      note: "Always available, verified via git history"
    fallbacks: []

  # OPTIONAL GITHUB SOURCES

  GITHUB_CONTEXT_ENGINEERING:
    source_id: "GITHUB_CONTEXT_ENGINEERING"
    classification: "OPTIONAL"
    purpose: "This documentation repository"
    primary:
      method: "github_connector"
      url: "https://github.com/zaida-wiss/context_enginering"
    fallbacks: []

  # GOOGLE SHEETS SOURCES (FALLBACK ONLY)

  GOOGLE_PROJECT_DATA_SHEET:
    source_id: "GOOGLE_PROJECT_DATA_SHEET"
    classification: "FALLBACK"
    purpose: "Project data fallback (commits, PRs, issues, board)"
    document_id: "1TECz-PkbJhK6Jux6tpjcXDNvUNUZGI_nnIDE5rKr5UI"
    primary:
      method: "google_drive_connector"
      url: "https://docs.google.com/spreadsheets/d/1TECz-PkbJhK6Jux6tpjcXDNvUNUZGI_nnIDE5rKr5UI/"
      note: "Requires Google Drive Connector"
    formats:
      csv: "https://docs.google.com/spreadsheets/d/1TECz-PkbJhK6Jux6tpjcXDNvUNUZGI_nnIDE5rKr5UI/export?format=csv"
      xlsx: "https://docs.google.com/spreadsheets/d/1TECz-PkbJhK6Jux6tpjcXDNvUNUZGI_nnIDE5rKr5UI/export?format=xlsx"
    tabs:
      commits: "gid=77162861"
      issues: "gid=869242669"
      prs: "gid=743460023"
      project_board: "gid=954257821"
    allowed_access_methods:
      - "google_drive_connector"
    forbidden_access_methods:
      - "web_search"
      - "csv_export_without_connector"
      - "general_web_access"

  GOOGLE_RISK_REGISTER:
    source_id: "GOOGLE_RISK_REGISTER"
    classification: "OPTIONAL"
    purpose: "Risk and asset register"
    document_id: "1A8XHxyAdbyrWlHSWTNgtwkKACdSiUr3F"
    primary:
      method: "google_drive_connector"
      url: "https://docs.google.com/spreadsheets/d/1A8XHxyAdbyrWlHSWTNgtwkKACdSiUr3F/"
      note: "Requires Google Drive Connector"
    formats:
      csv_risks: "https://docs.google.com/spreadsheets/d/1A8XHxyAdbyrWlHSWTNgtwkKACdSiUr3F/export?format=csv&gid=1796827285"
      csv_assets: "https://docs.google.com/spreadsheets/d/1A8XHxyAdbyrWlHSWTNgtwkKACdSiUr3F/export?format=csv&gid=684132349"
    tabs:
      risk_management: "gid=1796827285"
      assets: "gid=684132349"
    allowed_access_methods:
      - "google_drive_connector"

  # GOOGLE DOCS SOURCES (FALLBACK ONLY)

  GOOGLE_MEETING_PROTOCOL:
    source_id: "GOOGLE_MEETING_PROTOCOL"
    classification: "REQUIRED"
    purpose: "Current week: team capacity (available/allocated hours per team), sprint planning decisions, blockers, action items. For PRE-MEETING mode: scanned for documented constraints (absence, scheduling conflicts) that may affect planning"
    pre_meeting_data_rules: "Show only DOCUMENTED constraints at team level. Never estimate hours/percentages. Never dramatize or extrapolate."
    document_id: "1WD9XJBVrE49Csqz-XYiLgejlKlCA4t5sWiwoTkNiTD8"
    document_section: "Section 8: Kapacitet (currently empty — no quantitative data)"
    required_fields:
      - "team_capacity.frontend.available_hours (not found in document)"
      - "team_capacity.frontend.allocated_hours (not found in document)"
      - "team_capacity.backend.available_hours (not found in document)"
      - "team_capacity.backend.allocated_hours (not found in document)"
      - "team_capacity.native.available_hours (not found in document)"
      - "team_capacity.native.allocated_hours (not found in document)"
    current_status: "⚠️ INCOMPLETE — Section exists but contains no quantitative capacity data"
    note: "Team should populate Section 8 with available and allocated hours before presentation runs. Data must be extracted for current ISO week (valid_for_week = presentation week)"
    when_data_available: "Once filled in document, DATA_PRECHECK will extract and validate before presentation proceeds"
    primary:
      method: "google_drive_connector"
      url: "https://docs.google.com/document/d/1WD9XJBVrE49Csqz-XYiLgejlKlCA4t5sWiwoTkNiTD8/edit"
      note: "Requires Google Drive Connector"
    formats:
      txt: "https://docs.google.com/document/d/1WD9XJBVrE49Csqz-XYiLgejlKlCA4t5sWiwoTkNiTD8/export?format=txt"
      pdf: "https://docs.google.com/document/d/1WD9XJBVrE49Csqz-XYiLgejlKlCA4t5sWiwoTkNiTD8/export?format=pdf"
      html: "https://docs.google.com/document/d/1WD9XJBVrE49Csqz-XYiLgejlKlCA4t5sWiwoTkNiTD8/export?format=html"
    allowed_access_methods:
      - "google_drive_connector"
    forbidden_access_methods:
      - "web_search"
      - "export_without_connector"

  # UTILITIES

  WEBAIM_CONTRAST_CHECKER:
    source_id: "WEBAIM_CONTRAST_CHECKER"
    classification: "REFERENCE"
    purpose: "WCAG AA/AAA text contrast validation (reference only, not required for presentations)"
    primary:
      method: "web_direct"
      url: "https://webaim.org/resources/contrastchecker/"

  LOCALHOST_DEV_SERVER:
    source_id: "LOCALHOST_DEV_SERVER"
    classification: "REFERENCE"
    purpose: "Local development server (reference only)"
    primary:
      method: "local"
      url: "http://localhost:3000"

---

# CLASSIFICATION RULES

classifications:
  REQUIRED:
    definition: "Must succeed or presentation STOPS"
    action_on_failure: "STOP DATA_ACQUISITION_RECEIPT and report INCOMPLETE"
  FALLBACK:
    definition: "Try if primary fails (only if connector/method available)"
    action_on_failure: "Try next fallback or STOP if all fail"
  OPTIONAL:
    definition: "Nice-to-have, do not block presentation"
    action_on_failure: "Mark with ⚠️ and continue"
  REFERENCE:
    definition: "Documentation or external tools, not part of presentation pipeline"
    action_on_failure: "Ignore"

# ACCESS METHOD RULES

access_methods:
  github_connector:
    definition: "GitHub Connector (preferred for all GitHub sources)"
    supported_sources: ["GITHUB_MERGED_PRS", "GITHUB_OPEN_ISSUES", "GITHUB_OPEN_PRS", "GITHUB_BRANCHES", "GITHUB_COMMITS", "GITHUB_CONTEXT_ENGINEERING"]
  github_api:
    definition: "GitHub REST API (direct HTTPS to api.github.com)"
    supported_sources: ["GITHUB_MERGED_PRS", "GITHUB_OPEN_ISSUES"]
  github_web:
    definition: "GitHub web direct (fallback only)"
    supported_sources: ["GITHUB_MERGED_PRS", "GITHUB_OPEN_ISSUES"]
  google_drive_connector:
    definition: "Google Drive Connector (required for Google Sheets/Docs)"
    supported_sources: ["GOOGLE_PROJECT_DATA_SHEET", "GOOGLE_RISK_REGISTER", "GOOGLE_MEETING_PROTOCOL"]
  local_file:
    definition: "Local repository file (always available)"
    supported_sources: ["GITHUB_TEAM_ROSTER"]
  web_direct:
    definition: "Direct web access (reference tools only)"
    supported_sources: ["WEBAIM_CONTRAST_CHECKER"]
  local:
    definition: "Local server (development only)"
    supported_sources: ["LOCALHOST_DEV_SERVER"]

---

