# STRUCTURE: Current Sprint Metadata
#
# All data below MUST be fetched dynamically from registered sources.
# Do NOT hardcode examples or manual values.
# See EXTERNAL_SOURCES.yaml for source definitions.

current_sprint:
  # FETCH: ISO week (e.g., "2026-W39")
  # SOURCE: Presentation pipeline — derived from Monday meeting date
  week: null

  # FETCH: Week start date (ISO 8601)
  # SOURCE: Derived from ISO week
  start_date: null

  # FETCH: Week end date (ISO 8601)
  # SOURCE: Derived from ISO week
  end_date: null

  # FETCH: Current project phase name
  # SOURCE: Google Docs meeting protocol OR GitHub project board
  phase: null

  # FETCH: Sprint focus areas (list of strings)
  # SOURCE: Google Docs meeting protocol
  sprint_focus: []

  # FETCH: Weekly goals for all teams
  # SOURCE: Google Docs meeting protocol
  weekly_goals: []

  # FETCH: What PL meeting should focus on
  # SOURCE: Google Docs meeting protocol
  pl_meeting_focus: null

  # FETCH: Current blockers list
  # SOURCE: GitHub (issues tagged "blocker") OR Google Docs meeting protocol
  blockers: []

  team_capacity:
    # FETCH: Frontend available hours this week
    # SOURCE: Google Docs meeting protocol (mötesprotokollet)
    # FORMAT: number >= 0
    frontend:
      available_hours: null
      allocated_hours: null

    # FETCH: Backend available hours this week
    # SOURCE: Google Docs meeting protocol (mötesprotokollet)
    # FORMAT: number >= 0
    backend:
      available_hours: null
      allocated_hours: null

    # FETCH: Native available hours this week
    # SOURCE: Google Docs meeting protocol (mötesprotokollet)
    # FORMAT: number >= 0
    native:
      available_hours: null
      allocated_hours: null

    # RECORD: Source system identifier
    # FORMAT: string (e.g., "meeting_protocol_gdoc")
    source: null

    # FETCH: ISO 8601 timestamp when capacity was last updated
    # SOURCE: Google Docs document metadata (last modified time)
    updated_at: null

    # FETCH: ISO week this capacity data is valid for
    # SOURCE: Presentation pipeline — must match presentation week
    # FORMAT: "2026-W39"
    valid_for_week: null

  # FETCH: Next critical deadline
  # SOURCE: Google Docs meeting protocol OR GitHub Milestones
  next_deadline:
    type: null
    date: null
    description: null

  # FETCH: Operational notes, constraints
  # SOURCE: Google Docs meeting protocol
  notes: []
