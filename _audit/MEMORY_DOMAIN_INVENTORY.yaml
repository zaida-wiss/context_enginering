migration_order:
  - "1. Move course/manual data into data/manual/course after reconciling duplicates."
  - "2. Move instruction files into _ai_guides/project and split mixed ownership."
  - "3. Move schema-only CURRENT_SPRINT into presentation data schemas."
  - "4. Move/regenerate derived sprint timeline under data/derived."
  - "5. Simplify _memory/README.md to index only the true long-lived memory files."
  - "6. Consider merging GITHUB_MEMBER_MAPPING into TEAM_ROSTER to reduce duplicate identity truth."
  - "7. Update CONTEXT_REGISTRY paths and run repository-wide old-path validation after every migration batch."

status: "memory_domain_normalized"
