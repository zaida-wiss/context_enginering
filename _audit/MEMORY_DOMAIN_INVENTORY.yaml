    proposed_destination: "_ai_guides/project/TEAM_STANDARDS.md"
    migration_status: "migrated_2026-09-18"
    actual_destination: "_ai_guides/project/TEAM_STANDARDS.md"
    migration_note: "Split rules by owner if needed; avoid one large mixed instruction document."

  _memory/TEAM_ROSTER.md:
    class: memory
    reason: "Long-lived team membership and verified identity mapping."
    proposed_destination: "_memory/TEAM_ROSTER.md"
    migration_note: "Keep as canonical long-lived team knowledge; move presentation-specific coverage rules out."

  _memory/UI_DESIGN_REFERENCE.md:
    class: live_or_manual_data
    reason: "Reference material derived from supplied design mockups and product examples."
    proposed_destination: "data/manual/design/UI_DESIGN_REFERENCE.md"
    migration_status: "migrated_2026-09-18"
    actual_destination: "data/manual/design/UI_DESIGN_REFERENCE.md"
    migration_note: "Keep mockups as source artifacts and separate source facts from implementation suggestions."

  _memory/presentations/CURRENT_SPRINT.yaml:
    class: instruction
    reason: "Contains schema/structure only and says values must be fetched dynamically."
    proposed_destination: "_ai_guides/presentations/data/CURRENT_SPRINT_SCHEMA.yaml"
    migration_status: "migrated_2026-09-18"
    actual_destination: "_ai_guides/presentations/data/CURRENT_SPRINT_SCHEMA.yaml"
    migration_note: "This is a data schema, not memory."

  _memory/presentations/MILESTONES.yaml:
    class: live_or_manual_data
    reason: "Structured course milestone facts with dates and submission locations."
    proposed_destination: "data/manual/course/MILESTONES.yaml"
    migration_status: "migrated_2026-09-18"
    actual_destination: "data/manual/course/MILESTONES.yaml"
    migration_note: "Can become derived/live-backed if a registered course source is connected."

  _memory/presentations/SCHEDULE.yaml:
    class: live_or_manual_data
    reason: "Structured recurring schedule and current-week focus."
    proposed_destination: "data/manual/course/SCHEDULE.yaml"
    migration_status: "migrated_2026-09-18"
    actual_destination: "data/manual/course/TEAM_SCHEDULE.yaml"
    migration_note: "Separate recurring schedule facts from current-week derived focus if useful."

  _memory/presentations/TEAM_ROADMAP.yaml:
    class: live_or_manual_data
    reason: "Structured course/project timeline sourced from course schedule."
    proposed_destination: "data/manual/course/TEAM_ROADMAP.yaml"
    migration_status: "migrated_2026-09-18"
    actual_destination: "data/manual/course/TEAM_ROADMAP.yaml"
    migration_note: "Keep source metadata and derive current phase at runtime."

summary:
  memory:
    - "_memory/GITHUB_MEMBER_MAPPING.md"
    - "_memory/TEAM_ROSTER.md"
  live_or_manual_data:
