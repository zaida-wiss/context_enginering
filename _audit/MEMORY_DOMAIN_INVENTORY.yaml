---
name: memory_domain_inventory
description: Classification of current _memory files before migration
version: 1.0
metadata:
  type: migration_audit
  created: 2026-09-18
  branch: dev
---

classification_rules:
  memory: "Long-lived project knowledge that remains useful across tasks and is not primarily a rule or frequently changing dataset."
  live_or_manual_data: "Project/course facts that change over time or were copied from an external source and should live in the data domain."
  instruction: "Rules, standards, templates or AI operating guidance that belong in _ai_guides or another rule-owning documentation area."
  derived_data: "Calculated or synthesized state that should be reproducible from canonical sources and should live under data/derived."

files:

  _memory/COURSE_DEADLINES.md:
    class: live_or_manual_data
    reason: "Copied course deadlines and submission requirements; duplicates schedule/milestone facts and can change."
    proposed_destination: "data/manual/course/COURSE_DEADLINES.md"
    migration_status: "migrated_2026-09-18"
    actual_destination: "data/manual/course/COURSE_DEADLINES.md"
    migration_note: "Reconcile against structured milestones before moving."

  _memory/CTO_FEED_FORWARD.md:
    class: live_or_manual_data
    reason: "Course assignment facts, deadline and deliverable requirements."
    proposed_destination: "data/manual/course/CTO_FEED_FORWARD.md"
    migration_status: "migrated_2026-09-18"
    actual_destination: "data/manual/course/CTO_FEED_FORWARD.md"
    migration_note: "Consolidate with CTO_FEED_FORWARD_INSTRUCTIONS.md if both describe the same source."

  _memory/CTO_FEED_FORWARD_INSTRUCTIONS.md:
    class: live_or_manual_data
    reason: "Copied assignment instructions are source material, not AI-system instructions."
    proposed_destination: "data/manual/course/CTO_FEED_FORWARD_INSTRUCTIONS.md"
    migration_status: "migrated_2026-09-18"
    actual_destination: "data/manual/course/CTO_FEED_FORWARD_INSTRUCTIONS.md"
    migration_note: "Preserve source provenance and consider merging duplicate assignment content."

  _memory/DEFINITION_OF_DONE.md:
    class: instruction
    reason: "Defines project workflow/quality rules for when an issue is done."
    proposed_destination: "_ai_guides/project/DEFINITION_OF_DONE.md"
    migration_status: "migrated_2026-09-18"
    actual_destination: "_ai_guides/project/DEFINITION_OF_DONE.md"
    migration_note: "Review against current team decisions before declaring canonical."

  _memory/DEFINITION_OF_DONE_TEMPLATE.md:
    class: instruction
    reason: "Reusable issue template and process rule."
    proposed_destination: "_ai_guides/project/templates/DEFINITION_OF_DONE.md"
    migration_status: "migrated_2026-09-18"
    actual_destination: "_ai_guides/project/templates/DEFINITION_OF_DONE.md"
    migration_note: "Reference the canonical DoD authority rather than duplicating requirements."

  _memory/GITHUB_MEMBER_MAPPING.md:
    class: memory
    reason: "Stable identity mapping used to connect team members to GitHub handles."
    proposed_destination: "_memory/GITHUB_MEMBER_MAPPING.md" 
    migration_status: "consolidated_2026-09-18"
    actual_destination: "_memory/TEAM_ROSTER.md"
    migration_note: "Candidate for consolidation into TEAM_ROSTER.md to remove duplicate identity data."

  _memory/PROJEKTKONTEXT_AVANZA.md:
    class: instruction
    reason: "Explicit AI operating instructions, source hierarchy and presentation behavior."
    proposed_destination: "_ai_guides/project/PROJECT_CONTEXT_ROUTER.md"
    migration_status: "migrated_2026-09-18"
    actual_destination: "_ai_guides/project/PROJECT_CONTEXT_ROUTER.md"
    migration_note: "Large parts are stale and duplicate the new router/authority system; extract only still-valid project-specific guidance."

  _memory/README.md:
    class: instruction
    reason: "Acts as a router/index and currently contains stale routing claims."
    proposed_destination: "_memory/README.md"
    migration_note: "Keep only as a human memory index after other files are migrated; remove instruction ownership."

  _memory/RISK_REGISTER.md:
    class: instruction
    reason: "Currently an empty template rather than actual risk data."
    proposed_destination: "_ai_guides/project/templates/RISK_REGISTER.md"
    migration_status: "migrated_2026-09-18"
    actual_destination: "_ai_guides/project/templates/RISK_REGISTER.md"
    migration_note: "Actual risk records should come from a live registered source or data/manual."

  _memory/SCHEDULE.md:
    class: live_or_manual_data
    reason: "Course schedule and deadlines are living facts that explicitly may change."
    proposed_destination: "data/manual/course/SCHEDULE.md"
    migration_status: "migrated_2026-09-18"
    actual_destination: "data/manual/course/SCHEDULE.md"
    migration_note: "Prefer a live Canvas/calendar source when available; retain this only as sourced manual material."

  _memory/SPRINT_FOCUS_TIMELINE.md:
    class: derived_data
    reason: "Synthesized timeline/capacity view with stale and internally inconsistent dates."
    proposed_destination: "data/derived/SPRINT_FOCUS_TIMELINE.md"
    migration_status: "migrated_2026-09-18"
    actual_destination: "data/derived/SPRINT_FOCUS_TIMELINE.md"
    migration_note: "Do not treat as canonical until regenerated from verified schedule/milestones."

  _memory/TEAMSTANDARDS.md:
